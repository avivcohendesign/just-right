  const d = state.drag;
  if (d) {
    try { d.tile.el.releasePointerCapture(d.id); } catch (e) {}
    d.tile.el.classList.remove('active');
    if (d.moved) { state.corrections++; }
    state.drag = null;
  }
  if (!again) { state.ritual = makeRitual(forced); state.rituals++; counters(); }
  const r = state.ritual;
  r.count = 0; r.times = []; r.done = false; r.px = undefined;
  R.no.textContent = pad(state.rituals, 2);
  R.text.textContent = r.text;
  R.sub.textContent = again ? 'It didn’t feel right. Again.' : r.sub;
  R.sub.classList.toggle('err', !!again);
  clearTimeout(r.subT);
  if (again) r.subT = setTimeout(() => { R.sub.textContent = r.sub; R.sub.classList.remove('err'); }, 1800);
  R.pips.innerHTML = '<i></i>'.repeat(r.seq ? r.seq.length : r.need);
  R.el.classList.toggle('interactive', !!r.interactive);
  clearStage();
  drawMarks();
  R.el.hidden = false;           // no fade — it simply arrives
  if (r.interactive) r.setup();
  if (r.type === 'still') armStill();
}

function drawMarks() {
  R.el.querySelectorAll('.r-mark').forEach(m => m.remove());
  const r = state.ritual;
  if (!r.seq) return;
  [...new Set(r.seq)].forEach(k => {
    const m = document.createElement('i');
    m.className = 'r-mark' + (k === 'left' || k === 'right' ? ' edge' : '');
    m.dataset.k = k;
    m.style.left = POS[k][0];
    m.style.top = POS[k][1];
    R.el.appendChild(m);
  });
  markNext();
}
function markNext() {
  const r = state.ritual;
  R.el.querySelectorAll('.r-mark').forEach(m => m.classList.toggle('next', !!r.seq && m.dataset.k === r.seq[r.count]));
}
function pips() {
  const r = state.ritual;
  [...R.pips.children].forEach((p, i) => p.classList.toggle('on', i < r.count));
}
function flash(k) {
  const m = R.el.querySelector(`.r-mark[data-k="${k}"]`);
  if (!m) return;
  m.classList.remove('hit'); void m.offsetWidth; m.classList.add('hit');
}

function zoneAt(x, y) {
  const W = innerWidth, H = innerHeight, z = Math.max(90, Math.min(W, H) * .16);
  const L = x < z, Rt = x > W - z, T = y < z, B = y > H - z, out = new Set();
  if (L && T) out.add('tl');
  if (Rt && T) out.add('tr');
  if (Rt && B) out.add('br');
  if (L && B) out.add('bl');
  if (L) out.add('left');
  if (Rt) out.add('right');
  if (Math.abs(x - W / 2) < z / 2 && Math.abs(y - H / 2) < z / 2) out.add('c');
  return out;
}

function failRitual(msg, keep) {
  const r = state.ritual;
  if (!keep) { r.count = 0; r.times = []; if (r.interactive && r.reset) r.reset(); }
  pips(); markNext();
  const now = performance.now();
  if (now - (r.failAt || 0) < 600) return;   // don't stutter on repeated errors
  r.failAt = now;
  Sound.wrong();
  R.sub.textContent = msg || 'Wrong. From the beginning.';
  R.sub.classList.add('err');
  R.box.classList.remove('shake'); void R.box.offsetWidth; R.box.classList.add('shake');
  clearTimeout(r.subT);
  r.subT = setTimeout(() => { if (state.ritual === r) { R.sub.textContent = r.sub; R.sub.classList.remove('err'); } }, 1500);
}

function completeRitual() {
  const r = state.ritual;
  clearInterval(r.iv);
  cancelAnimationFrame(r.raf);
  if (r.interactive) setCount(r.seq ? r.seq.length : r.need);
  r.done = true;
  Sound.right();
  const doubt = !r.doubted && Math.random() < .22 + tier() * .08;
  setTimeout(() => {
    if (state.ritual !== r) return;
    if (doubt) { r.doubted = true; startRitual(true); }
    else endRitual();
  }, 450);
}

function endRitual() {
  const r = state.ritual;
  if (r) { clearInterval(r.iv); clearTimeout(r.subT); cancelAnimationFrame(r.raf); }
  state.ritual = null;
  R.el.hidden = true;
  R.el.classList.remove('interactive');
  clearStage();
  lastRitual = performance.now();
  scheduleRitual();
  setTimeout(() => Voice.say('ritual'), 800);
}

/* stillness */
function armStill() {
  const r = state.ritual;
  clearInterval(r.iv);
  r.t0 = performance.now(); r.count = 0; pips();
  r.iv = setInterval(() => {
    const sec = Math.min(r.need, Math.floor((performance.now() - r.t0) / 1000));
    if (sec !== r.count) { r.count = sec; pips(); if (sec >= r.need) completeRitual(); }
  }, 80);
}
function resetStill() {
  const r = state.ritual;
  if (r.done) return;
  if (performance.now() - r.t0 > 300) failRitual('You moved. Again.');
  armStill();
}

/* rhythm */
function rhythmPress() {
  const r = state.ritual, now = performance.now(), t = r.times;
  if (t.length && now - t[t.length - 1] > 2200) t.length = 0;
  t.push(now);
  if (t.length >= 3) {
    const base = t[1] - t[0], cur = t[t.length - 1] - t[t.length - 2];
    if (Math.abs(cur - base) / base > .28) { failRitual('Uneven. From the beginning.'); return; }
  }
  r.count = t.length; pips();
  if (r.count >= r.need) completeRitual();
}

/* ======================================================
   Interactive rituals — hover, trace, drag, rotate, hold.
   Each one: setup() builds it, reset() restarts it after a failure,
   down/move/up receive the pointer.
   ====================================================== */
const RS = $('rSvg');
const CX = () => innerWidth / 2;
const CY = () => innerHeight / 2 + innerHeight * .07;
const minWH = () => Math.min(innerWidth, innerHeight);
function clearStage() { RS.innerHTML = ''; RS.setAttribute('viewBox', `0 0 ${innerWidth} ${innerHeight}`); }
function setCount(n) {
  const r = state.ritual;
  if (!r) return;
  r.count = Math.max(0, Math.min(n, r.seq ? r.seq.length : r.need));
  pips();
}
const nudge = msg => failRitual(msg, true);
const SWISS = ['var(--blue)', 'var(--red)', 'var(--green)', 'var(--yellow)'];

const INTERACTIVE = {

  /* hover along a circle, clockwise, without leaving it */
  trace: () => ({
    type: 'trace', interactive: true, need: 8,
    text: 'Trace the circle.', sub: 'Clockwise. Stay on the line. All the way round.',
    setup() {
      this.R = minWH() * .19; this.band = Math.max(14, this.R * .13);
      svgEl('circle', { cx: CX(), cy: CY(), r: this.R, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 1, opacity: .3 }, RS);
      svgEl('circle', { cx: CX(), cy: CY(), r: this.R, fill: 'none', stroke: 'var(--ink)', 'stroke-width': this.band * 2, opacity: .035 }, RS);
      this.prog = svgEl('circle', { cx: CX(), cy: CY(), r: this.R, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 3, pathLength: 360, 'stroke-dasharray': '0 360' }, RS);
      this.reset();
    },
    reset() { this.acc = 0; this.last = null; if (this.prog) this.prog.setAttribute('stroke-dasharray', '0 360'); setCount(0); },
    move(x, y) {
      const dx = x - CX(), dy = y - CY();
      if (Math.abs(Math.hypot(dx, dy) - this.R) > this.band) {
        if (this.acc > 10) failRitual('You left the line. Again.'); else this.reset();
        return;
      }
      const a = Math.atan2(dy, dx) * 180 / Math.PI;
      if (this.last === null) {
        this.last = a;
        this.prog.setAttribute('transform', `rotate(${a} ${CX()} ${CY()})`);
        return;
      }
      let da = a - this.last;
      if (da > 180) da -= 360;
      if (da < -180) da += 360;
      this.last = a;
      if (da < -4) { failRitual('Wrong direction. Again.'); return; }
      if (da > 0) this.acc += da;
      this.prog.setAttribute('stroke-dasharray', `${Math.min(360, this.acc)} 360`);
      setCount(Math.floor(this.acc / 360 * this.need));
      if (this.acc >= 360) completeRitual();
    }
  }),

  /* wipe every speck by hovering — and some come back */
  clean: () => ({
    type: 'clean', interactive: true, need: 8,
    text: 'Clean it.', sub: 'Every speck. Move over it to wipe.',
    setup() {
      const w = Math.min(innerWidth * .5, 460), h = w * .6, x0 = CX() - w / 2, y0 = CY() - h / 2;
      this.box = [x0, y0, w, h];
      svgEl('rect', { x: x0, y: y0, width: w, height: h, fill: 'var(--tile)' }, RS);
      this.rad = Math.max(20, w * .055);
      this.specks = []; this.left = 0; this.total = 0; this.spawned = 0;
      const n = 70 + tier() * 30;
      for (let i = 0; i < n; i++) this.speck();
      this.cur = svgEl('circle', { cx: -99, cy: -99, r: this.rad, fill: 'none', stroke: 'var(--ink)', 'stroke-width': .7, opacity: .35 }, RS);
      // contamination returns when you are almost done
      this.iv = setInterval(() => {
        if (this.left > 0 && this.left <= 5 && this.spawned < 4 && Math.random() < .3) { this.speck(); this.spawned++; this.progress(); }
      }, 1100);
      this.progress();
    },
    speck() {
      const [x0, y0, w, h] = this.box;
      const sp = { x: x0 + rand(5, w - 5), y: y0 + rand(5, h - 5) };
      sp.el = svgEl('circle', { cx: sp.x, cy: sp.y, r: rand(.8, 2.6), fill: 'var(--ink)', opacity: rand(.35, .9) }, RS);
      if (this.cur) RS.appendChild(this.cur);
      this.specks.push(sp); this.left++; this.total++;
    },
    progress() { setCount(Math.floor((1 - this.left / this.total) * this.need)); },
    reset() {},
    move(x, y) {
      this.cur.setAttribute('cx', x); this.cur.setAttribute('cy', y);
      const r2 = this.rad * this.rad;
      for (const sp of this.specks) {
        if (sp.dead) continue;
        if ((x - sp.x) ** 2 + (y - sp.y) ** 2 < r2) {
          sp.dead = true; this.left--;
          sp.el.style.transition = 'opacity 280ms'; sp.el.setAttribute('opacity', 0);
        }
      }
      this.progress();
      if (this.left === 0) completeRitual();
    }
  }),

  /* rest the cursor on numbered points, in order, one full second each */
  dwell: () => ({
    type: 'dwell', interactive: true, need: 5,
    text: 'Rest on each point.', sub: 'In order. One full second each. Don’t touch the others.',
    setup() {
      const n = this.need, span = Math.min(innerWidth * .62, 540);
      const order = [...Array(n).keys()].sort(() => Math.random() - .5);
      this.pts = [];
      for (let i = 0; i < n; i++) {
        const x = CX() - span / 2 + span * i / (n - 1), y = CY() + (i % 2 ? -1 : 1) * rand(15, 60);
        const g = svgEl('g', {}, RS);
        svgEl('circle', { cx: x, cy: y, r: 19, fill: 'var(--tile)', stroke: 'var(--ink)', 'stroke-width': 1, 'stroke-opacity': .3 }, g);
        const arc = svgEl('circle', { cx: x, cy: y, r: 19, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 3, pathLength: 360, 'stroke-dasharray': '0 360', transform: `rotate(-90 ${x} ${y})` }, g);
        const t = svgEl('text', { x, y: y + 4, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--ink)' }, g);
        t.textContent = order[i] + 1;
        this.pts[order[i]] = { x, y, g, arc };
      }
      this.reset();
      this.iv = setInterval(() => this.tick(), 30);
    },
    reset() {
      this.idx = 0; this.enter = null; setCount(0);
      (this.pts || []).forEach(p => { p.arc.setAttribute('stroke-dasharray', '0 360'); p.g.setAttribute('opacity', 1); });
    },
    move(x, y) { this.x = x; this.y = y; },
    tick() {
      if (this.x === undefined) return;
      const near = p => Math.hypot(this.x - p.x, this.y - p.y) < 23;
      const wrong = this.pts.some((p, j) => j > this.idx && near(p));
      if (wrong && !this.wasWrong) { this.wasWrong = true; failRitual('Not that one. From the beginning.'); return; }
      this.wasWrong = wrong;
      const p = this.pts[this.idx];
      if (!p) return;
      if (near(p)) {
        if (this.enter === null) this.enter = performance.now();
        const f = Math.min(1, (performance.now() - this.enter) / 1000);
        p.arc.setAttribute('stroke-dasharray', `${f * 360} 360`);
        if (f >= 1) {
          p.g.setAttribute('opacity', .22); this.idx++; this.enter = null; setCount(this.idx);
          if (this.idx >= this.need) completeRitual();
        }
      } else if (this.enter !== null) {
        this.enter = null; p.arc.setAttribute('stroke-dasharray', '0 360');
      }
    }
  }),

  /* drag a square back into its outline — to the pixel */
  putback: () => ({
    type: 'putback', interactive: true, need: 6,
    text: 'Put it back.', sub: 'Exactly where it was. Hold Shift to move slowly.',
    setup() {
      this.s = minWH() * .085;
      this.tx = CX() + rand(-1, 1) * innerWidth * .1;
      this.ty = CY() + rand(-1, 1) * innerHeight * .05;
      svgEl('rect', { x: this.tx - this.s / 2, y: this.ty - this.s / 2, width: this.s, height: this.s, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 1, 'stroke-dasharray': '3 3' }, RS);
      this.sq = svgEl('rect', { width: this.s, height: this.s, fill: pick(SWISS) }, RS);
      this.read = svgEl('text', { x: CX(), y: innerHeight - 70, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--mute)' }, RS);
      this.reset();
    },
    reset() {
      const a = rand(0, Math.PI * 2), d = minWH() * .2;
      this.x = this.tx + Math.cos(a) * d; this.y = this.ty + Math.sin(a) * d * .6;
      this.drag = null; this.place();
    },
    err() { return Math.hypot(this.x - this.tx, this.y - this.ty); },
    place() {
      this.sq.setAttribute('x', this.x - this.s / 2); this.sq.setAttribute('y', this.y - this.s / 2);
      const e = this.err();
      this.read.textContent = `OFFSET  ${e.toFixed(1)} PX`;
      setCount(Math.floor((1 - Math.min(1, e / (this.s * 2))) * this.need));
    },
    down(x, y) {
      if (Math.abs(x - this.x) < this.s / 2 + 8 && Math.abs(y - this.y) < this.s / 2 + 8) { this.drag = { lx: x, ly: y }; return true; }
    },
    move(x, y, ev) {
      if (!this.drag) return;
      const f = ev.shiftKey ? .15 : 1;
      this.x += (x - this.drag.lx) * f; this.y += (y - this.drag.ly) * f;
      this.drag.lx = x; this.drag.ly = y;
      this.place();
    },
    up() {
      if (!this.drag) return;
      this.drag = null;
      const e = this.err();
      if (e <= 1.5) { this.x = this.tx; this.y = this.ty; this.place(); completeRitual(); }
      else if (e < this.s) nudge(`Off by ${e.toFixed(1)} px. Not exactly.`);
    }
  }),

  /* drag dots vertically onto a line — and one slips when you let go */
  lineup: () => ({
    type: 'lineup', interactive: true, need: 4,
    text: 'Line them up.', sub: 'Drag each one onto the line. Exactly on it.',
    setup() {
      const span = Math.min(innerWidth * .56, 480);
      this.ly = CY();
      svgEl('line', { x1: CX() - span / 2 - 50, y1: this.ly, x2: CX() + span / 2 + 50, y2: this.ly, stroke: 'var(--ink)', 'stroke-width': 1, opacity: .45 }, RS);
      this.items = SWISS.map((c, i) => ({ x: CX() - span / 2 + span * i / 3, el: svgEl('circle', { cx: CX() - span / 2 + span * i / 3, cy: 0, r: 11, fill: c }, RS) }));
      this.reset();
    },
    reset() {
      this.items.forEach(it => {
        do { it.y = this.ly + rand(-1, 1) * innerHeight * .14; } while (Math.abs(it.y - this.ly) < 25);
        it.el.setAttribute('cy', it.y);
      });
      this.drag = null; this.score();
    },
    on(it) { return Math.abs(it.y - this.ly) < 1.2; },
    score() { const ok = this.items.filter(it => this.on(it)).length; setCount(ok); return ok; },
    down(x, y) {
      const it = this.items.find(it => Math.hypot(x - it.x, y - it.y) < 22);
      if (it) { this.drag = { it, ly: y }; return true; }
    },
    move(x, y, ev) {
      if (!this.drag) return;
      const it = this.drag.it;
      it.y += (y - this.drag.ly) * (ev.shiftKey ? .15 : 1); this.drag.ly = y;
      it.el.setAttribute('cy', it.y); this.score();
    },
    up() {
      if (!this.drag) return;
      const it = this.drag.it; this.drag = null;
      if (this.score() === this.items.length) { completeRitual(); return; }
      const others = this.items.filter(o => o !== it && this.on(o));
      if (this.on(it) && others.length && Math.random() < .35) {
        setTimeout(() => {
          if (state.ritual !== this || this.done) return;
          const o = pick(others); o.y += pick([-1, 1]) * rand(2, 4); o.el.setAttribute('cy', o.y);
          this.score(); nudge('Something moved.');
        }, 450);
      }
    }
  }),

  /* press and hold, release at exactly N seconds — the pulse lies */
  hold: () => {
    const target = pick([3, 4]);
    return {
      type: 'hold', interactive: true, need: 1,
      text: `Hold. Let go at exactly ${target === 3 ? 'three' : 'four'}.`, sub: 'Press anywhere and count in your head.',
      setup() {
        this.r0 = minWH() * .08;
        svgEl('circle', { cx: CX(), cy: CY(), r: this.r0, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 1, opacity: .4 }, RS);
        this.dot = svgEl('circle', { cx: CX(), cy: CY(), r: 0, fill: 'var(--ink)' }, RS);
        this.read = svgEl('text', { x: CX(), y: CY() + this.r0 + 34, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--mute)' }, RS);
        this.reset();
      },
      reset() { this.t0 = null; cancelAnimationFrame(this.raf); if (this.dot) this.dot.setAttribute('r', 0); },
      down() {
        this.t0 = performance.now(); this.read.textContent = '';
        const tick = () => {
          const t = (performance.now() - this.t0) / 1000;   // pulses at 1.13 Hz — not quite seconds
          this.dot.setAttribute('r', (this.r0 * .55 * (.5 + .5 * Math.sin(t * Math.PI * 2 * 1.13))).toFixed(2));
          this.raf = requestAnimationFrame(tick);
        };
        tick();
        return true;
      },
      up() {
        if (this.t0 === null) return;
        const t = (performance.now() - this.t0) / 1000;
        this.reset();
        this.read.textContent = `${t.toFixed(2)} S`;
        if (Math.abs(t - target) <= .12) completeRitual();
        else failRitual(`${t.toFixed(2)} seconds. Again.`);
      }
    };
  },

  /* rotate a bar until it is level — to the hundredth of a degree */
  straighten: () => ({
    type: 'straighten', interactive: true, need: 6,
    text: 'Straighten it.', sub: 'Drag sideways to rotate. Shift for fine. Level means level.',
    setup() {
      const L = Math.min(innerWidth * .4, 380);
      svgEl('line', { x1: CX() - L / 2 - 34, y1: CY(), x2: CX() - L / 2 - 12, y2: CY(), stroke: 'var(--ink)', opacity: .45 }, RS);
      svgEl('line', { x1: CX() + L / 2 + 12, y1: CY(), x2: CX() + L / 2 + 34, y2: CY(), stroke: 'var(--ink)', opacity: .45 }, RS);
      this.bar = svgEl('rect', { x: CX() - L / 2, y: CY() - 3, width: L, height: 6, fill: pick(SWISS) }, RS);
      this.read = svgEl('text', { x: CX(), y: CY() + 52, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--mute)' }, RS);
      this.reset();
    },
    reset() { this.a = pick([-1, 1]) * rand(6, 18); this.drag = null; this.draw(); },
    draw() {
      this.bar.setAttribute('transform', `rotate(${this.a} ${CX()} ${CY()})`);
      this.read.textContent = `${this.a >= 0 ? '+' : '−'}${Math.abs(this.a).toFixed(2)}°`;
      setCount(Math.floor((1 - Math.min(1, Math.abs(this.a) / 18)) * this.need));
    },
    down(x) { this.drag = { lx: x }; return true; },
    move(x, y, ev) {
      if (!this.drag) return;
      this.a += (x - this.drag.lx) * .08 * (ev.shiftKey ? .12 : 1); this.drag.lx = x; this.draw();
    },
    up() {
      if (!this.drag) return;
      this.drag = null;
      if (Math.abs(this.a) < .05) { this.a = 0; this.draw(); completeRitual(); }
      else if (Math.abs(this.a) < .8) nudge('Almost. Almost isn’t level.');
    }
  })
};

window.addEventListener('pointermove', ev => {
  const r = state.ritual;
  if (r && r.interactive && !r.done && r.move) r.move(ev.clientX, ev.clientY, ev);
});
const ritualUp = ev => {
  const r = state.ritual;
  if (r && r.interactive && !r.done && r.up) r.up(ev.clientX, ev.clientY, ev);
};
window.addEventListener('pointerup', ritualUp);
window.addEventListener('pointercancel', ritualUp);

R.el.addEventListener('pointerdown', ev => {
  const r = state.ritual;
  if (!r || r.done) return;
  ev.preventDefault();
  if (r.interactive) {
    if (r.down && r.down(ev.clientX, ev.clientY, ev)) { try { R.el.setPointerCapture(ev.pointerId); } catch (e) {} }
    if (r.move) r.move(ev.clientX, ev.clientY, ev);
    return;
  }
  if (r.type === 'still') { resetStill(); return; }
  if (r.type === 'rhythm') { rhythmPress(); return; }   // taps count on touch screens
  const want = r.seq[r.count];
  if (zoneAt(ev.clientX, ev.clientY).has(want)) {
    r.count++; flash(want); pips(); markNext();
    if (r.count >= r.seq.length) completeRitual();
  } else failRitual();
});

window.addEventListener('pointermove', ev => {
  const r = state.ritual;
  if (!r || r.type !== 'still' || r.done) return;
  if (r.px === undefined) { r.px = ev.clientX; r.py = ev.clientY; return; }
  if (Math.hypot(ev.clientX - r.px, ev.clientY - r.py) > 4) {
    r.px = ev.clientX; r.py = ev.clientY;
    resetStill();
  }
});

/* ======================================================
   Zoom & pan — look closer at a field that keeps shrinking.
   Wheel / pinch zooms toward the pointer. Drag the background
   (or hold Space, or middle-drag) to move around.
   ====================================================== */
const view = $('view'), stage = document.querySelector('.stage'), frame = document.querySelector('.frame');
const Z = { z: 1, x: 0, y: 0 };
let pan = null, pinch = null, spaceDown = false;
const touches = new Map();
const maxZoom = () => 6;

function applyView(animate) {
  const W = frame.offsetWidth, H = frame.offsetHeight;
  Z.z = Math.min(maxZoom(), Math.max(1, Z.z));
  Z.x = Math.min(0, Math.max(W - W * Z.z, Z.x));
  Z.y = Math.min(0, Math.max(H - H * Z.z, Z.y));
  view.style.transition = animate ? 'transform 650ms cubic-bezier(.65,0,.15,1)' : 'none';
  view.style.transform = `translate(${Z.x}px, ${Z.y}px) scale(${Z.z})`;
  $('zread').textContent = `${Z.z.toFixed(1)}×`;
  stage.classList.toggle('zoomed', Z.z > 1.001 || spaceDown);
}
function zoomAt(px, py, factor, animate) {
  const r = frame.getBoundingClientRect();
  const fx = px - r.left, fy = py - r.top;
  const cx = (fx - Z.x) / Z.z, cy = (fy - Z.y) / Z.z;
  const nz = Math.min(maxZoom(), Math.max(1, Z.z * factor));
  Z.x = fx - cx * nz; Z.y = fy - cy * nz; Z.z = nz;
  applyView(animate);
}
function zoomCenter(factor) {
  const r = frame.getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, factor, true);
}
function resetView(animate) { Z.z = 1; Z.x = 0; Z.y = 0; applyView(animate); }
const blocked = () => state.ritual || state.locked;

function cancelTileDrag() {
  const d = state.drag;
  if (!d) return;
  try { d.tile.el.releasePointerCapture(d.id); } catch (e) {}
  d.tile.el.classList.remove('active');
  if (d.moved) { state.corrections++; counters(); }
  state.drag = null;
}

window.addEventListener('wheel', ev => {
  if (blocked()) return;
  ev.preventDefault();
  const dy = ev.deltaMode === 1 ? ev.deltaY * 16 : ev.deltaY;
  zoomAt(ev.clientX, ev.clientY, Math.exp(-dy * (ev.ctrlKey ? .01 : .0016)));
}, { passive: false });

// capture phase: decide pan / pinch before a tile grabs the pointer
stage.addEventListener('pointerdown', ev => {
  if (blocked()) return;
  if (ev.pointerType === 'touch') {
    touches.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (touches.size === 2) {
      cancelTileDrag(); pan = null;
      const [a, b] = [...touches.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      ev.stopPropagation(); ev.preventDefault();
      return;
    }
  }
  const onTile = ev.target.closest && ev.target.closest('.tile');
  if (ev.button === 1 || spaceDown || (!onTile && Z.z > 1.001)) {
    ev.preventDefault(); ev.stopPropagation();
    pan = { id: ev.pointerId, x: ev.clientX, y: ev.clientY };
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
    stage.classList.add('panning');
  }
}, true);

window.addEventListener('pointermove', ev => {
  if (touches.has(ev.pointerId)) touches.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pinch && touches.size >= 2) {
    const [a, b] = [...touches.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    Z.x += mx - pinch.mx; Z.y += my - pinch.my;
    zoomAt(mx, my, d / pinch.d);
    Object.assign(pinch, { d, mx, my });
    return;
  }
  if (pan && ev.pointerId === pan.id) {
    Z.x += ev.clientX - pan.x; Z.y += ev.clientY - pan.y;
    pan.x = ev.clientX; pan.y = ev.clientY;
    applyView();
  }
});
const endPointer = ev => {
  touches.delete(ev.pointerId);
  if (touches.size < 2) pinch = null;
  if (pan && ev.pointerId === pan.id) { pan = null; stage.classList.remove('panning'); }
};
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

document.addEventListener('keydown', ev => {
  if (ev.key === ' ' && !state.ritual && !(ev.target && ev.target.tagName === 'INPUT')) { ev.preventDefault(); if (!spaceDown) { spaceDown = true; applyView(); } }
});
document.addEventListener('keyup', ev => {
  if (ev.key === ' ') { spaceDown = false; applyView(); }
});
window.addEventListener('resize', () => { sizeFrame(); applyView(); });

$('zin').addEventListener('click', () => { if (!blocked()) zoomCenter(1.5); });
$('zout').addEventListener('click', () => { if (!blocked()) zoomCenter(1 / 1.5); });
// (the 1:1 button is gone; 0 on the keyboard still resets the view)

/* ======================================================
   The inner voice — two lines that argue.
   The first one knows better. The second one always answers.
   With every stage the first grows quieter and the second louder,
   until it no longer lets the first one finish.
   ====================================================== */
/* ======================================================
   One voice. It doesn't converse — it presses.
   Not insults: doubt, urgency, the feeling that something is still off.
   Every line is set off by something you just did, and it gets more insistent over time.
   ====================================================== */
const VOICE_LINES = {
  perfect: {                // you got a tile right
    early: ['Is it, though?', 'Look again.', 'Are you sure?', 'Something is still off.', 'It doesn’t feel right.'],
    late:  ['It moved. Did you see it move?', 'Not quite. Not quite.', 'You’ll know if you leave it.', 'Check it once more.', 'It feels wrong. It feels wrong.']
  },
  check: {                  // you touched a tile that was already right
    early: ['Just to be sure.', 'Did it move?', 'Check it. Just in case.', 'One more look.'],
    late:  ['What if it moved while you weren’t looking?', 'You can’t be sure.', 'Again. Just to be sure.', 'You looked. Look again.']
  },
  break: {                  // your fix broke one that was right
    early: ['That one was fine.', 'You moved it.', 'Now that one is wrong.', 'It was right. Wasn’t it?'],
    late:  ['Now it’s wrong again.', 'Fix it before it gets worse.', 'It’s spreading.']
  },
  near: {                   // you let go a hair off
    early: ['It’s off. Just slightly.', 'Can you see it?', 'Almost isn’t right.', 'You’re leaving it like that?'],
    late:  ['You can feel it from here.', 'It’s still there.', 'Off. Off. Off.', 'You won’t stop thinking about it.']
  },
  stuck: {                  // the same tile, again and again
    early: ['Again.', 'Once more. Then it’ll feel right.', '{n} times. Still not right.', 'This one.'],
    late:  ['Again. Again.', 'It has to feel right.', '{n} times and it still doesn’t feel right.', 'Until it feels right.']
  },
  better: {                 // better, not right
    early: ['Closer. Not there.', 'Not yet.', 'Still not right.'],
    late:  ['Not yet. Not yet.', 'Keep going.', 'Closer isn’t right.']
  },
  worse: {                  // you made it worse
    early: ['Wrong way.', 'Further away.', 'Go back.'],
    late:  ['Go back. Go back.', 'Now it’s worse.', 'Undo it.']
  },
  tug: {                    // the fix moved its partner
    early: ['Something moved over there.', 'Did you see that?', 'That one changed.'],
    late:  ['Everything you fix moves something else.', 'Over there. Look.', 'What else moved?']
  },
  almost: {                 // one left
    early: ['One left.', 'Don’t leave it now.'],
    late:  ['Just one. Just one.', 'Finish it.']
  },
  idle: {                   // you stopped
    early: ['You’re leaving it like this?', 'It’s still not right.', 'Just one more.', 'What if you stop now?'],
    late:  ['You can feel it. Can’t you?', 'It’s still there. It’s still there.', 'You won’t be able to stop thinking about it.']
  },
  long: {                   // the time you have spent
    early: ['{time}. Still not right.', '{corr} corrections.'],
    late:  ['{time}. Just a little longer.', 'You were going to do something else.']
  },
  expand: {                 // the board comes undone
    early: ['Of course.', 'Start again.', 'It wasn’t right.'],
    late:  ['Again. From the beginning.', 'It never felt right.']
  }
};
// not every touch gets a thought — it lands harder when you can't predict it
const SOMETIMES = new Set(['perfect', 'check', 'near', 'stuck', 'better', 'worse', 'tug']);
const VOICE_PRIORITY = { demo: 10, expand: 9, ritual: 8, stuck: 7, break: 6, tug: 6, near: 5, worse: 4, better: 4, perfect: 5, check: 5, almost: 4, idle: 3, long: 2 };
const VOICE_EVERY = { demo: 0, expand: 0, ritual: 0, stuck: 2500, break: 2000, tug: 3000, near: 2000, worse: 2000, better: 2000, perfect: 1500, check: 2000, almost: 6000, idle: 6000, long: 30000 };

const Voice = (() => {
  const layer = document.createElement('div');
  layer.className = 'notes';
  layer.setAttribute('aria-live', 'polite');
  document.body.appendChild(layer);
  const caret = document.createElement('span'); caret.className = 'caret';
  let n = 0, typing = null, typingText = '';
  // 0 → 1 over the first three minutes: everything comes faster, and stops waiting its turn
  const pace = () => state.started ? Math.min(1, (performance.now() - state.t0) / 90000) : 0;
  const said = [];   // every thought so far — they come back

  let cur = null, timers = [], lastAt = 0, lastInput = performance.now();
  const lastCat = {}, bags = {};
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  function draw(cat) {
    const P = pace(), tier = P > .35 && Math.random() < P ? 'late' : 'early';
    const k = cat + tier;
    if (!bags[k] || !bags[k].length) bags[k] = [...VOICE_LINES[cat][tier]].sort(() => Math.random() - .5);
    let t = bags[k].pop();
    // later on it starts repeating itself inside a single thought
    if (P > .6 && Math.random() < (P - .6) * 1.2) t = `${t} ${t}`;
    return t;
  }
  function fill(t) {
    const sec = Math.floor((performance.now() - state.t0) / 1000), m = Math.floor(sec / 60);
    return t.replace('{time}', m < 1 ? `${sec} seconds` : m === 1 ? 'a minute' : `${m} minutes`)
            .replace('{corr}', String(state.corrections))
            .replace('{n}', String(state.sameCount || 0));
  }

  /* a note, dropped at a random place. Closing it is allowed. It doesn't help for long. */
  function note(lines, tile) {     // lines: [['v', text]]
    n++;
    const el = document.createElement('div');
    el.className = 'note';
    el.innerHTML = `<div class="note-h"><i>${String(n).padStart(4, '0')}</i><button class="note-x" aria-label="Close">×</button></div>`;
    const spans = lines.map(([kind]) => {
      const l = document.createElement('div');
      l.className = `ln ${kind}`;
      const sp = document.createElement('span');
      sp.style.fontSize = `${(12 + pace() * 3).toFixed(1)}px`;   // it gets louder
      l.appendChild(sp); el.appendChild(l);
      return sp;
    });
    const longest = Math.max(...lines.map(([k, t]) => t.length)) * (1 + pace() * .25);
    const w = Math.min(320, Math.max(150, longest * 7.3 + 26));
    const h = 32 + lines.length * 19 * Math.ceil((longest * 7.3) / (w - 24));
    el.style.width = `${w}px`;
    let x = rand(12, innerWidth - w - 12), y = rand(12, innerHeight - h - 12);
    if (tile && tile.el.isConnected) {          // pinned beside the tile it is about
      const r = tile.el.getBoundingClientRect();
      x = r.left + r.width * rand(.15, .75) - w / 2;
      y = Math.random() < .5 ? r.top - h + r.height * .18 : r.bottom - r.height * .18;
    }
    el.style.left = `${Math.round(Math.min(innerWidth - w - 12, Math.max(12, x)))}px`;
    el.style.top = `${Math.round(Math.min(innerHeight - h - 12, Math.max(12, y)))}px`;
    el._lines = lines; el._tile = tile;
    ARCH.lastNote = lines.map(l => l[1]).join(' ');
    el.querySelector('.note-x').addEventListener('click', ev => { ev.stopPropagation(); el.remove(); rebound(el); });
    layer.appendChild(el);
    // measure the note with its full text, so it never runs off the screen
    spans.forEach((sp, k) => { sp.textContent = lines[k][1]; });
    const fw = el.offsetWidth, fh = el.offsetHeight;
    el.style.left = `${Math.round(Math.min(innerWidth - fw - 12, Math.max(12, parseFloat(el.style.left))))}px`;
    el.style.top = `${Math.round(Math.min(innerHeight - fh - 12, Math.max(12, parseFloat(el.style.top))))}px`;
    spans.forEach(sp => { sp.textContent = ''; });
    while (layer.children.length > 260) layer.firstChild.remove();
    return spans;
  }
  /* pushing a thought away: usually it goes. About one time in three it comes back a few
     seconds later, somewhere else — and now and then it comes back twice. */
  function rebound(el) {
    const back = el._back || 0;
    if (state.ended || Math.random() > .33 / (1 + back)) return;
    setTimeout(() => {
      if (state.ended || state.locked) return;
      const copies = Math.random() < .3 ? 2 : 1;
      for (let c = 0; c < copies; c++) {
        const texts = el._lines.map(l => l[1]);
        const spans = note(el._lines, Math.random() < .5 ? el._tile : null);
        layer.lastChild._back = back + 1;
        fast(spans, texts);
      }
    }, rand(1800, 5000));
  }
  // how much of the screen the notes already cover (0–1, overlaps counted loosely)
  function covered() {
    let a = 0;
    for (const el of layer.children) a += el.offsetWidth * el.offsetHeight;
    return Math.min(1, a / (innerWidth * innerHeight * 1.5));
  }
  function type(span, text, speed, cutAt, done) {
    const end = cutAt == null ? text.length : cutAt;
    let i = 0;
    const node = document.createTextNode('');
    span.appendChild(node);
    span.appendChild(caret);
    typing = node; typingText = text;
    (function step() {
      if (!span.isConnected) { typing = null; if (done) done(); return; }   // closed mid-thought
      if (i < end) { i++; node.textContent = text.slice(0, i); later(step, speed); return; }
      typing = null;
      if (done) done();
    })();
  }
  function finish() {
    if (typing) { typing.textContent = typingText; typing = null; }
  }
  function rest() {
    later(() => { cur = null; lastAt = performance.now(); if (caret.parentNode && !typing) caret.remove(); }, 150);
  }
  function speak(cat, tile, pr) {
    clear();
    finish();   // a new thought arrives: the one still being typed is completed at once, never cut off
    const x = fill(draw(cat));
    if (tile) (tile.thoughts = tile.thoughts || []).push([x, performance.now()]);
    cur = { pr };
    const [sp] = note([['v', x]], tile);
    type(sp, x, Math.max(10, 22 - pace() * 12), null, rest);
  }

  function say(cat, tile, force) {
    return;   // no notes during the game: nothing tells you how you're doing
    if (cat !== 'demo' && !VOICE_LINES[cat]) return;
    if (!force && SOMETIMES.has(cat) && Math.random() > .65) return;
    if (!force && (state.locked || state.ritual || !state.started)) return;
    const now = performance.now(), pr = VOICE_PRIORITY[cat] || 1;
    const P = pace();
    if (!force && now - (lastCat[cat] || -1e9) < (VOICE_EVERY[cat] || 0) * (1 - .85 * P)) return;
    if (cur && pr <= cur.pr) {                                 // a louder thought is already speaking…
      // …but later on, thoughts stop waiting their turn and pile up on top of each other
      if (!force && Math.random() < .45 + P * .55) { lastCat[cat] = now; quick(cat, tile); }
      return;
    }
    const gap = 500 * (1 - .8 * P);
    if (!cur && !force && pr < 8 && now - lastAt < gap) return;
    lastCat[cat] = now;
    speak(cat === 'demo' ? pick(Object.keys(VOICE_LINES)) : cat, tile, pr);
  }
  function hush() {   // stops mid-thought; what was written stays, broken off
    clear(); cur = null;
    finish();
    caret.remove();
  }
  function poke() { lastInput = performance.now(); }

  // silence is also a trigger
  setInterval(() => {
    if (!state.started || state.locked || state.ritual) return;
    const now = performance.now();
    if (now - lastInput > 4000) say('idle');
    else if (now - state.t0 > 45000) say('long');
  }, 1000);

  /* rumination: go back to a tile, and what you thought about it comes back too — word for word. */
  let lastEcho = 0;
  function revisit(tile) {
    const now = performance.now(), P = pace();
    const old = (tile.thoughts || []).filter(t => now - t[1] > 10000 * (1 - .8 * P));   // something you thought on an earlier visit
    if (!old.length || state.locked || now - lastEcho < 1500 * (1 - .85 * P)) return;
    lastEcho = now;
    const [x] = pick(old);
    fast(note([['v', x]], tile), [x]);
  }
  // a thought that doesn't wait for the one before it to finish
  function quick(cat, tile) {
    const x = fill(draw(cat));
    if (tile) (tile.thoughts = tile.thoughts || []).push([x, performance.now()]);
    fast(note([['v', x]], tile), [x]);
  }
  function fast(spans, texts) {
    spans.map((sp, k) => [sp, texts[k]]).reduce((delay, [span, text]) => {
      let i = 0;
      setTimeout(function step() {
        if (state.ended || !span.isConnected) return;
        span.textContent = text.slice(0, ++i);
        if (i < text.length) setTimeout(step, 14);
      }, delay);
      return delay + text.length * 14 + 120;
    }, 0);
  }

  return { say, hush, poke, revisit };
})();

/* ======================================================
   Sound — a room tone that tightens with every flaw,
   a small clean click when something is right,
   and real silence in the moment of harmony.
   Everything is synthesized; nothing is loaded.
   ====================================================== */
const Sound = (() => {
  let ctx = null, master, hum, air, whine, muted = false, lastCrack = 0;
  function start() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ctx.destination);

    // room tone: low sines a fraction apart, so they slowly beat against each other
    hum = ctx.createGain(); hum.gain.value = 0; hum.connect(master);
    [[55, 1], [55.6, .8], [110.3, .22]].forEach(([f, v]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(hum); o.start();
    });
    // air: soft filtered noise
    const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const n = ctx.createBufferSource(); n.buffer = buf; n.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650;
    air = ctx.createGain(); air.gain.value = 0;
    n.connect(lp); lp.connect(air); air.connect(master); n.start();
    // the whine: thin, high, never quite in tune with itself
    whine = ctx.createGain(); whine.gain.value = 0; whine.connect(master);
    [3150, 3163].forEach(f => { const o = ctx.createOscillator(); o.frequency.value = f; o.connect(whine); o.start(); });
  }
  const live = () => ctx && ctx.state === 'running';
  function level(x) {            // x: 0 = everything right, 1 = nothing right
    if (!ctx || document.body.classList.contains('harmony') || state.ended) return;
    const t = ctx.currentTime;
    hum.gain.setTargetAtTime(.03 + x * .06, t, .7);
    air.gain.setTargetAtTime(.006 + x * .02, t, .7);
    whine.gain.setTargetAtTime(x * x * .005, t, .9);
  }
  function silence(tc) {
    if (!ctx) return;
    const t = ctx.currentTime;
    [hum, air, whine].forEach(g => { g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0, t, tc || .12); });
  }
  function blip(freq, dur, vol, type, at = 0) {
    if (!live()) return;
    const t = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .004);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + .03);
  }
  return {
    start, level, silence,
    right: () => { blip(1760, .09, .045); blip(3520, .05, .01); },
    tick:  () => blip(1250, .025, .018, 'triangle'),
    crack: () => { const n = performance.now(); if (n - lastCrack < 350) return; lastCrack = n; blip(233, .07, .02, 'triangle'); },
    wrong: () => { blip(140, .18, .05, 'triangle'); blip(149, .18, .04, 'triangle'); },
    arrive:() => { blip(880, .14, .03); blip(932, .14, .026); },
    toggle() {
      muted = !muted;
      if (master) master.gain.setTargetAtTime(muted ? 0 : 1, ctx.currentTime, .05);
      return muted;
    }
  };
})();
// browsers only allow sound after the first gesture
['pointerdown', 'keydown'].forEach(t => window.addEventListener(t, () => Sound.start(), { capture: true }));

/* ---------- Demo controls ---------- */
const DEMO_KEYS = ['trace', 'clean', 'dwell', 'putback', 'lineup', 'hold', 'straighten', 'tap', 'rhythm'];
function skip() {
  if (state.ritual) { endRitual(); return; }
  if (state.locked) return;
  begin();
  state.tiles.forEach(t => { t.s = t.t; });  // every tile to its exact target
  afterInput();                               // → perfect → harmony → zoom out
}


document.addEventListener('keydown', ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA')) {   // typing your name is just typing
    if (ev.key === 'Enter') ev.target.blur();
    return;
  }
  if ($('ask') && !$('ask').classList.contains('out')) return;   // nothing happens before the question is answered
  const r = state.ritual;
  if (ev.key === 'd' || ev.key === 'D') { document.body.classList.toggle('nodemo'); return; }
  if (ev.key === 'm' || ev.key === 'M') { Sound.toggle(); return; }
  if (ev.key === 'f' || ev.key === 'F') {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    return;
  }
  if (ev.key === 'a' || ev.key === 'A') { if (!$('archive').classList.contains('on')) Archive.show(); else Archive.hide(); return; }
  if (state.ended) return;
  if (ev.key === 'e' || ev.key === 'E') { if (!state.started) begin(); ending(); return; }
  if (ev.key === 'n' || ev.key === 'N') { ev.preventDefault(); skip(); return; }
  if (!r && !state.locked) {
    if (ev.key === '+' || ev.key === '=') { zoomCenter(1.5); return; }
    if (ev.key === '-' || ev.key === '_') { zoomCenter(1 / 1.5); return; }
    if (ev.key === '0') { resetView(true); return; }
  }
  if (false) {
    begin(); startRitual(false, DEMO_KEYS[+ev.key - 1]); return;
  }
  if ((ev.key === 'v' || ev.key === 'V') && !r && !state.locked) { begin(); Voice.say('demo', null, true); return; }
  if (false) {
    if (!state.locked) { begin(); startRitual(); }
    return;
  }
  if (!r) return;
  ev.preventDefault();
  ev.stopPropagation();
  if (r.done) return;
  if (r.type === 'still') resetStill();
  else if (r.type === 'rhythm' && (ev.key === ' ' || ev.key === 'Enter')) { if (!ev.repeat) rhythmPress(); }
}, true);

init();
})();
</script>
</body>
