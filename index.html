<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Align</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23fff'/%3E%3Cg%3E%3Crect x='25' y='9' width='14' height='14' fill='%23E8619E'/%3E%3Crect x='42' y='9' width='14' height='14' fill='%230E9F6E'/%3E%3Crect x='8' y='26' width='14' height='14' fill='%23E8619E'/%3E%3Crect x='25' y='26' width='14' height='14' fill='%235B3FC4'/%3E%3Crect x='42' y='26' width='14' height='14' fill='%23E8619E'/%3E%3Crect x='8' y='43' width='14' height='14' fill='%230E9F6E'/%3E%3Crect x='25' y='43' width='14' height='14' fill='%23E8619E'/%3E%3Crect x='42' y='43' width='14' height='14' fill='%230E9F6E'/%3E%3Crect x='13' y='13' width='14' height='14' fill='%230E9F6E'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#F1EFEA;
  --tile:#FFFFFF;
  --ink:#141414;
  --mute:#8C8981;
  --hair:rgba(20,20,20,.07);
  --blue:#1D3FD8;
  --red:#E2341D;
  --green:#0E9F6E;
  --black:#141414;
  --yellow:#F2B705;
  --orange:#F26B1D;
  --violet:#5B3FC4;
  --teal:#0F8A86;
  --pink:#E8619E;
  --navy:#14246B;
  --ochre:#B8862B;
  --grey:#A3A098;
  --lime:#8DBF2E;
  --sky:#3FA9F5;
  --crimson:#B0123B;
  --coral:#FF7A5C;
  --magenta:#C2188F;
  --forest:#1F6B3A;
  --aqua:#1FBFC4;
  --plum:#6B2A6E;
  --mustard:#D9A400;
  --cobalt:#0050B8;
  --rose:#F28CA8;
  --rust:#A8461C;
  --lilac:#A98BE0;
  --mint:#6FD6AE;
  --olive:#7A8424;
  --peach:#FFB27A;
  --S:min(68vh, 84vw, 700px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
}

/* ---------- Gallery chrome ---------- */
.chrome{position:fixed;font-size:11px;letter-spacing:.07em;text-transform:uppercase;line-height:1.55;transition:opacity 1100ms ease;z-index:2;pointer-events:none}
.tl{top:32px;left:36px}
.tr{top:32px;right:36px;text-align:right}
.bl{bottom:32px;left:36px}
.br{bottom:32px;right:36px;text-align:right}
.bc{bottom:38px;left:50%;transform:translateX(-50%);color:var(--mute);text-transform:none;letter-spacing:.01em;font-size:12px;white-space:nowrap;transition:opacity 1200ms ease}
.title{font-weight:700;letter-spacing:.16em}
.label{color:var(--mute)}
.big{font-size:26px;font-weight:500;letter-spacing:-.01em;text-transform:none;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:5px}
.big span{color:var(--mute);font-weight:400}
.num{font-variant-numeric:tabular-nums}
.bar{width:168px;height:2px;background:var(--hair);margin-top:12px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--ink);transition:width 350ms ease,background 350ms ease}
.bar.full i{background:var(--green)}
.row{display:flex;gap:28px;justify-content:flex-end}
.row div{min-width:72px}

/* ---------- Stage ---------- */
.stage{position:fixed;inset:0;overflow:hidden}
.frame{position:absolute;width:var(--S);height:var(--S)}
.frame{--m:36px;--ms:18px}
.mark{display:none !important}   /* the field runs past the edges — there is no frame to mark */
.mark{position:absolute;width:var(--ms);height:var(--ms);border:0 solid var(--ink);opacity:.5;transition:opacity 1100ms ease;pointer-events:none}
.mark.a{top:calc(var(--m) * -1);left:calc(var(--m) * -1);border-width:1.5px 0 0 1.5px}
.mark.b{top:calc(var(--m) * -1);right:calc(var(--m) * -1);border-width:1.5px 1.5px 0 0}
.mark.c{bottom:calc(var(--m) * -1);left:calc(var(--m) * -1);border-width:0 0 1.5px 1.5px}
.mark.d{bottom:calc(var(--m) * -1);right:calc(var(--m) * -1);border-width:0 1.5px 1.5px 0}

#grid{position:absolute;inset:0;display:grid;transform-origin:0 0;will-change:transform}
.view{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.stage.zoomed{cursor:grab}
.stage.panning,.stage.panning .tile{cursor:grabbing}

/* zoom control */
.zoomer{position:fixed;left:36px;bottom:32px;z-index:5;display:flex;flex-direction:row;align-items:center;gap:8px;transition:opacity 1600ms ease;opacity:0;pointer-events:none}
body.dense .zoomer{opacity:.4;pointer-events:auto}
body.dense .zoomer:hover{opacity:1}
.zoomer button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(20,20,20,.18);background:var(--bg);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;transition:border-color 250ms,background 250ms,color 250ms}
.zoomer button:hover{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.zoomer button:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.zoomer svg{width:14px;height:14px}
.zread{font-size:10px;letter-spacing:.08em;color:var(--mute);font-variant-numeric:tabular-nums;min-width:36px;text-align:center}
.zoomer .zreset{font:500 9px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.06em}
body.harmony .zoomer{opacity:0;pointer-events:none}
.cell{position:relative}
.tile{
  position:absolute;inset:var(--iy,4.6%) var(--ix,4.6%);background:var(--tile);
  cursor:ew-resize;touch-action:none;outline:none;
  transition:opacity 900ms ease;
}
.cell.enter .tile{opacity:0;transition:none}
.tile svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;overflow:visible}
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px var(--hair);transition:box-shadow 300ms ease}
.tile:hover::after{box-shadow:inset 0 0 0 1px rgba(20,20,20,.16)}
.tile.echo::after{box-shadow:inset 0 0 0 1px rgba(20,20,20,.5)}
.tile.echo svg{animation:twitch 260ms ease infinite alternate}
@keyframes twitch{to{transform:translateX(.6px)}}
.tile.active::after{box-shadow:inset 0 0 0 1px rgba(20,20,20,.38)}
.tile:focus-visible::after{box-shadow:inset 0 0 0 1.5px var(--ink)}
.tile::before{display:none}
.tile.snap svg{animation:settle 560ms cubic-bezier(.2,.7,.2,1)}
@keyframes settle{0%{transform:scale(1)}28%{transform:scale(.982)}100%{transform:scale(1)}}
@keyframes snap{
  0%  {opacity:0;box-shadow:0 0 0 0 rgba(14,159,110,0)}
  12% {opacity:1;box-shadow:0 0 0 1.5px var(--green),0 0 22px rgba(14,159,110,.38)}
  100%{opacity:0;box-shadow:0 0 0 1.5px var(--green),0 0 44px rgba(14,159,110,0)}
}

/* slider inside each tile (drawn in SVG so it scales with the zoom) */
.trk{stroke:var(--ink);stroke-width:.5;opacity:.12;transition:opacity 250ms}
.thumb{fill:var(--ink);opacity:.28;transition:opacity 250ms}
.tile:hover .trk,.tile.active .trk{opacity:.3}
.tile:hover .thumb,.tile.active .thumb{opacity:.85}
.ok{display:none}
/* a tile that is right loses its control — nothing left to fix */
.tile.right .trk,.tile.right .thumb{opacity:0}
.tile.right:hover .trk{opacity:.1}
.tile.right:hover .thumb{opacity:.3}
/* before anyone touches anything, one control quietly moves */
.thumb{transform-box:fill-box}
.tile.beckon .trk{opacity:.35}
.tile.beckon .thumb{animation:beckon 2.6s ease-in-out infinite}
@keyframes beckon{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(7px);opacity:.95}}

/* ---------- Rituals: interruptions that block the field ---------- */
.ritual{
  --z:max(90px,16vmin);
  position:fixed;inset:0;z-index:10;display:grid;place-items:center;
  background:rgba(241,239,234,.76);-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);
  cursor:crosshair;touch-action:none;
}
.ritual[hidden]{display:none}
.ritual::before{display:none}
.r-box{text-align:center;max-width:min(640px,86vw);pointer-events:none}
.r-label{display:none;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-variant-numeric:tabular-nums}
.r-text{font-size:clamp(20px,2.2vw,28px);font-weight:500;letter-spacing:-.01em;line-height:1.2}
.r-sub{font-size:13px;color:var(--mute);margin-top:10px;margin-left:3px;min-height:1.4em;transition:color 200ms}
.r-sub.err{color:var(--ink);font-weight:500}
.r-pips{display:none;gap:6px;justify-content:center;margin-top:30px}
.r-pips i{width:8px;height:8px;border:1px solid var(--ink)}
.r-pips i.on{background:var(--ink)}
.r-box.shake{animation:shake 380ms cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
.r-mark{position:fixed;width:30px;height:30px;margin:-15px 0 0 -15px;border:1px solid var(--ink);opacity:.18;pointer-events:none;transition:opacity 150ms}
.r-mark::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:var(--ink)}
.r-mark.edge{width:0;height:38vh;margin:-19vh 0 0 0;border-width:0 0 0 1px}
.r-mark.edge::after{width:7px;height:7px;margin:-3.5px 0 0 -4px}
.r-mark.next{opacity:1}
.r-mark.hit{animation:hit 320ms ease-out}
@keyframes hit{0%{transform:scale(1.6);background:var(--ink)}100%{transform:scale(1)}}

.r-svg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.r-svg text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.ritual.interactive .r-box{position:fixed;top:9vh;left:0;right:0;margin:0 auto}
.ritual.interactive .r-text{font-size:clamp(20px,2.2vw,28px)}

/* ---------- Intro card ---------- */
.intro{position:fixed;inset:0;z-index:12;display:grid;place-items:center;background:rgba(241,239,234,.9);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:opacity 700ms ease}
.intro.out{opacity:0;pointer-events:none}
.intro-card{width:min(520px,86vw)}
.intro .label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.intro h1{font-size:clamp(30px,4.4vw,48px);font-weight:500;letter-spacing:-.025em;line-height:1.04;margin:14px 0 30px}
.intro ol{list-style:none;border-top:1px solid rgba(20,20,20,.14)}
.intro li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:14px 0;border-bottom:1px solid rgba(20,20,20,.14);font-size:15px;line-height:1.45}
.intro li span{font-size:11px;letter-spacing:.08em;color:var(--mute);font-variant-numeric:tabular-nums;padding-top:3px}
.intro .demo-pair{display:flex;gap:10px;align-items:center;margin:30px 0 0}
.intro .demo-pair svg{width:54px;height:54px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--hair)}
.intro .demo-pair i{font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.begin{margin-top:34px;display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);border:0;padding:15px 22px 15px 24px;font:500 12px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background 250ms}
.begin:hover{background:var(--blue)}
.begin svg{width:16px;height:16px}

/* ---------- Inner voice: a running log, like code ---------- */
.log{
  position:fixed;inset:20px;z-index:4;pointer-events:none;
  font:12px/1.65 "SF Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:0;
  display:flex;flex-direction:column;transition:opacity 1100ms ease;
}
/* no box: every line is printed straight over the field, on its own strip of paper */
.log-head,.ln{width:fit-content;max-width:100%;background:rgba(241,239,234,.93);padding:0 7px;box-sizing:border-box}
.log-head{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding-top:4px;padding-bottom:4px;margin-bottom:6px}
.log-body{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;column-width:300px;column-gap:24px;column-fill:auto}
.ln{display:grid;grid-template-columns:4.2ch auto;column-gap:1.4ch;white-space:pre-wrap;word-break:break-word;break-inside:avoid}
.ln i{font-style:normal;color:var(--mute);opacity:.45;font-variant-numeric:tabular-nums}
.ln.v > span{color:var(--ink);font-weight:600;letter-spacing:-.01em}
.ln.v1 > span{color:var(--mute)}
.ln.v2 > span{color:var(--ink);font-weight:600;padding-left:2ch}
.ln.v2 > span::before{content:"\2192\00a0";font-weight:400;color:var(--mute)}
.caret{display:inline-block;width:.6em;height:1.05em;vertical-align:-.15em;background:var(--ink);margin-left:1px;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* thoughts as notes: dropped anywhere on the screen, each one can be closed */
.notes{position:fixed;inset:0;z-index:4;pointer-events:none;transition:opacity 1100ms ease}
.note{
  position:absolute;pointer-events:auto;box-sizing:border-box;cursor:default;
  background:var(--bg);padding:7px 12px 10px;
  box-shadow:0 0 0 1px rgba(20,20,20,.16),0 10px 24px -14px rgba(20,20,20,.35);
  font:12px/1.6 "SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
.note-h{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:10px;color:var(--mute);margin-bottom:3px}
.note-h i{font-style:normal;letter-spacing:.08em;opacity:.6;font-variant-numeric:tabular-nums}
.note-x{border:0;background:none;padding:0 0 0 6px;margin:-2px -4px 0 0;font:15px/1 "SF Mono",ui-monospace,Menlo,monospace;color:var(--mute);cursor:pointer}
.note-x:hover{color:var(--ink)}
.note .ln{display:block;width:auto;max-width:none;background:none;padding:0;white-space:pre-wrap;word-break:break-word}
body.harmony .notes{opacity:.12}
body.harmony .log{opacity:.12}


/* demo: skip to next stage */
.skip{
  position:fixed;right:36px;top:50%;transform:translateY(-50%);z-index:11;
  width:44px;height:44px;border-radius:50%;border:1px solid rgba(20,20,20,.18);
  background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;
  transition:opacity 900ms ease,border-color 250ms ease,background 250ms ease,color 250ms ease;
}
.skip:hover{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.skip:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.skip svg{width:16px;height:16px}
.skip-label{z-index:11;position:fixed;right:36px;top:calc(50% + 34px);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);width:44px;text-align:center;transition:opacity 900ms ease;pointer-events:none}
body.harmony .skip,body.harmony .skip-label{opacity:0;pointer-events:none}

/* exhibition: the demo control exists only when asked for (D) */
body.nodemo .skip,body.nodemo .skip-label{display:none}

/* opening */
.opening{position:fixed;inset:0;z-index:12;display:grid;place-items:center;background:var(--bg);transition:opacity 1800ms ease;cursor:default}
.opening.out{opacity:0;pointer-events:none}
.opening p{font-size:clamp(20px,2.2vw,28px);font-weight:500;letter-spacing:-.01em;opacity:0;animation:appear 1600ms 500ms ease forwards}
@keyframes appear{to{opacity:1}}

/* closing */
.closing{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--bg);opacity:0;pointer-events:none;transition:opacity 2600ms ease}
.closing.on{opacity:1;pointer-events:auto}
.closing div{text-align:left}
.closing p{opacity:0;transition:opacity 1600ms ease}
.closing p.on{opacity:1}
.closing .c1{font-size:14px;color:var(--mute)}
.closing .c2{font-size:clamp(20px,2.2vw,28px);font-weight:500;letter-spacing:-.01em;margin:8px 0 0 3px}
.closing .c3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:34px;font-variant-numeric:tabular-nums}

/* the only number left: the time of day */
.clock{position:fixed;right:20px;bottom:20px;z-index:4;background:rgba(241,239,234,.94);padding:6px 9px;font-size:11px;letter-spacing:.1em;color:var(--mute);font-variant-numeric:tabular-nums;pointer-events:none;transition:opacity 1100ms ease}
body.harmony .clock{opacity:0}

/* harmony: everything falls silent */
body.harmony .chrome,body.harmony .mark{opacity:0}
body.harmony .tile::after{box-shadow:inset 0 0 0 1px rgba(20,20,20,0)}
body.harmony .trk,body.harmony .thumb,body.harmony .ok{opacity:0}

/* ---------- two ways out, in the bottom margin ---------- */
.endbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc((var(--B, 90px) - 30px) / 2);z-index:6;display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity 1400ms ease}
.endbar.on{opacity:1;pointer-events:auto}
/* ---------- tools: help that is also one more way to check ---------- */
.tray{position:fixed;right:96px;bottom:calc((var(--B, 90px) - 34px) / 2);z-index:6;display:flex;gap:6px}
.tray button{width:34px;height:34px;padding:0;border:0;background:var(--tile);color:var(--mute);cursor:pointer;display:grid;place-items:center;transition:color 250ms}
.tray button:hover,.tray button:focus-visible{color:var(--ink);outline:none}
.tray button.on{color:var(--blue)}
.tray svg{width:18px;height:18px}
body.ended .tray,body.ended .tool,body.ended .guide{display:none !important}
.tool{position:fixed;left:0;top:0;z-index:8;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;display:none}
.tool.on{display:block}
.tool.dragging{cursor:grabbing}
/* ruler */
.ruler{width:440px;height:46px;margin:-23px 0 0 -220px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);box-shadow:0 0 0 1px rgba(20,20,20,.08)}
.ruler::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:
  repeating-linear-gradient(90deg,rgba(20,20,20,.55) 0 1px,transparent 1px 40px) 0 0/100% 14px no-repeat,
  repeating-linear-gradient(90deg,rgba(20,20,20,.3) 0 1px,transparent 1px 8px) 0 0/100% 7px no-repeat}
.ruler::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--blue);opacity:.55}
.ruler .deg{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);font-size:10px;letter-spacing:.08em;color:var(--mute);font-variant-numeric:tabular-nums;pointer-events:none}
.ruler .rot{position:absolute;right:-30px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--tile);box-shadow:0 0 0 1px rgba(20,20,20,.14);cursor:alias;display:grid;place-items:center;color:var(--mute)}
.ruler .rot svg{width:12px;height:12px}
/* level */
.level{width:180px;height:44px;margin:-22px 0 0 -90px;background:rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(20,20,20,.08)}
.level .tube{position:absolute;left:22px;right:22px;top:50%;height:16px;margin-top:-8px;border-radius:8px;background:var(--bg);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(20,20,20,.06)}
.level .tube::before,.level .tube::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:rgba(20,20,20,.35)}
.level .tube::before{left:calc(50% - 10px)}.level .tube::after{left:calc(50% + 9px)}
.level .bub{position:absolute;left:50%;top:2px;width:16px;height:12px;margin-left:-8px;border-radius:6px;background:var(--blue);opacity:.75}
/* magnifier */
.lens{width:210px;height:210px;margin:-105px 0 0 -105px;border-radius:50%;overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px rgba(20,20,20,.12),0 0 0 6px rgba(255,255,255,.9),0 0 0 7px rgba(20,20,20,.08)}
.lens .lens-in{position:absolute;left:0;top:0;width:100vw;height:100vh;pointer-events:none}
.lens .lens-in .frame{position:absolute}
/* grid guide: fine lines through every shape, it zooms with the board */
.guide{position:absolute;inset:0;z-index:3;pointer-events:none;display:none;
  background:
   linear-gradient(90deg,transparent calc(50% - .5px),rgba(29,63,216,.45) calc(50% - .5px),rgba(29,63,216,.45) calc(50% + .5px),transparent calc(50% + .5px)),
   linear-gradient(0deg,transparent calc(50% - .5px),rgba(29,63,216,.45) calc(50% - .5px),rgba(29,63,216,.45) calc(50% + .5px),transparent calc(50% + .5px)),
   linear-gradient(90deg,transparent calc(25% - .5px),rgba(29,63,216,.16) calc(25% - .5px),rgba(29,63,216,.16) calc(25% + .5px),transparent calc(25% + .5px),transparent calc(75% - .5px),rgba(29,63,216,.16) calc(75% - .5px),rgba(29,63,216,.16) calc(75% + .5px),transparent calc(75% + .5px)),

/* ======================================================

   n   : how many neighbours each tile feels (left, up, up-left; wrapping)
   tol : how close to zero an error must be to count as perfect
   ====================================================== */
// c × r tiles per stage. Gentle at first, then the field keeps growing.
// one board. seventy shapes. every one is tied to exactly one other —
// and the ties close into a single loop, so nothing can be fixed alone.
const LEVELS = [
  { c: 10, r: 7, k: .58, n: 1, tol: .009 }   // seventy shapes: one row more than feels reasonable
];
const levelDef = i => LEVELS[Math.min(i, LEVELS.length - 1)];
const LV = () => levelDef(state.level);
const intensity = () => state.started ? Math.min(8, Math.floor((performance.now() - state.t0) / 45000)) : 0;
const tier = () => Math.min(3, Math.floor(state.level / 2));

const DRAG_PX = 380;      // px of drag for the full slider range
const FINE = .18;         // Shift multiplier
const HARMONY_MS = 1500;  // the reward
const ZOOM_MS = 4200;
const BREAK_MS = 1500;    // how long the infection takes to reach the old tiles

const HINTS = {
  1: 'Drag a tile sideways until its shape is perfect.',
  2: 'Every correction is felt by its neighbours.',
  3: 'Two more. There are always two more.',
  4: 'Hold Shift for precision.',
  5: 'The field has no edge. What leaves one side returns on the other.',
  6: 'Scroll to look closer. It won\u2019t help.',
  7: 'There was never going to be an end.'

  if (t > 0 && Math.random() < .6) return pick(SHAPE_TIERS[t]);
  return pick(SHAPE_TIERS.slice(0, t + 1).flat());

function colorsFor(tier, n = 3) {
  const t = capT(tier);
  const all = PALETTE_TIERS.slice(0, t + 1).flat().map(k => `var(--${k})`);
  const min = Math.min(...all.map(c => colorUse[c] || 0));
  const out = [pick(all.filter(c => (colorUse[c] || 0) === min))];
  while (out.length < n) out.push(pick(all.filter(c => !out.includes(c))));
  return out;
}

const $ = id => document.getElementById(id);
const grid = $('grid');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = v => Math.min(1, Math.max(0, v));
const sign = () => (Math.random() < .5 ? -1 : 1);

function svgEl(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

/* ---------- Shapes: each returns update(f), f ∈ [-1,1], 0 = perfect ----------
   c = array of colours. Complex forms carry several flaws at once. */
const tr = (x, y) => `translate(${x.toFixed(3)} ${y.toFixed(3)})`;
const rot = (a, x, y) => `rotate(${a.toFixed(3)} ${x} ${y})`;
const dir = () => pick([0, 45, 90, 135, 180, 225, 270, 315]) * Math.PI / 180;
const r3 = n => Math.floor(Math.random() * n);

const BUILD = {
  /* ---- tier 1: primitives ---- */
  stripes(svg, c) {
    const idx = r3(3); let tg, cy;
    for (let j = 0; j < 3; j++) {
      const y = 26.5 + j * 20, g = svgEl('g', {}, svg);
      svgEl('rect', { x: 20, y, width: 60, height: 7, fill: c[0] }, g);
      if (j === idx) { tg = g; cy = y + 3.5; }
    }
    return f => tg.setAttribute('transform', rot(f * 13, 50, cy));
  },
  ring(svg, c) {
    const base = pick([-90, 0, 90, 180, 45, -135]);
    const ring = svgEl('circle', { cx: 50, cy: 50, r: 25, fill: 'none', stroke: c[0], 'stroke-width': 8, pathLength: 360 }, svg);
    return f => {
      const gap = Math.abs(f) * 46;
      if (gap < .05) ring.removeAttribute('stroke-dasharray');
      else ring.setAttribute('stroke-dasharray', `${(360 - gap).toFixed(3)} ${gap.toFixed(3)}`);
      ring.setAttribute('transform', rot(base + f * 30, 50, 50));
    };
  },
  square(svg, c) {
    const a = dir();
    const r = svgEl('rect', { x: 31, y: 31, width: 38, height: 38, fill: c[0] }, svg);
    return f => r.setAttribute('transform', tr(f * 13 * Math.cos(a), f * 13 * Math.sin(a)));
  },
  triangle(svg, c) {
    const p = svgEl('polygon', { points: '50,20 78,68.5 22,68.5', fill: c[0] }, svg);
    return f => p.setAttribute('transform', rot(f * 17, 50, 52.33));
  },

  /* ---- tier 2 ---- */
  cross(svg, c) {
    const vertical = Math.random() < .5;
    svgEl('rect', { x: 22, y: 46, width: 56, height: 8, fill: c[0] }, svg);
    const bar = svgEl('rect', { x: 46, y: 22, width: 8, height: 56, fill: c[1] }, svg);
    return f => bar.setAttribute('transform', vertical ? tr(0, f * 11) : tr(f * 11, 0));
  },
  dots(svg, c) {
    const idx = r3(4), a = dir(); let mv;
    [[35, 35], [65, 35], [35, 65], [65, 65]].forEach(([x, y], j) => {
      const d = svgEl('circle', { cx: x, cy: y, r: 8, fill: j === 3 ? c[1] : c[0] }, svg);
      if (j === idx) mv = d;
    });
    return f => mv.setAttribute('transform', tr(f * 9 * Math.cos(a), f * 9 * Math.sin(a)));
  },
  diamond(svg, c) {
    const r = svgEl('rect', { x: 31, y: 31, width: 38, height: 38, fill: c[0] }, svg);
    return f => r.setAttribute('transform', rot(45 + f * 14, 50, 50));
  },
  chevrons(svg, c) {
    const idx = r3(3); let tg, cy;
    for (let j = 0; j < 3; j++) {
      const y = 34 + j * 16, g = svgEl('g', {}, svg);
      svgEl('polyline', { points: `26,${y + 9} 50,${y - 7} 74,${y + 9}`, fill: 'none', stroke: j === 1 ? c[1] : c[0], 'stroke-width': 6, 'stroke-miterlimit': 10 }, g);
      if (j === idx) { tg = g; cy = y + 1; }
    }
    return f => tg.setAttribute('transform', rot(f * 14, 50, cy));
  },
  halfsplit(svg, c) {
    const g = svgEl('g', {}, svg);
    svgEl('path', { d: 'M22 50 A28 28 0 0 1 78 50 Z', fill: c[0] }, g);
    const b = svgEl('path', { d: 'M22 50 A28 28 0 0 0 78 50 Z', fill: c[1] }, g);
    return f => { g.setAttribute('transform', rot(f * 18, 50, 50)); b.setAttribute('transform', tr(0, Math.abs(f) * 5)); };
  },
  bars(svg, c) {
    const idx = r3(3); let tg;
    [56, 40, 48].forEach((w, j) => {
      const r = svgEl('rect', { x: 22, y: 29 + j * 16, width: w, height: 10, fill: c[j] }, svg);
      if (j === idx) tg = r;
    });
    return f => tg.setAttribute('transform', tr(f * 9, 0));
  },

  /* ---- tier 3 ---- */
  concentric(svg, c) {
    const a = dir();
    svgEl('circle', { cx: 50, cy: 50, r: 30, fill: c[0] }, svg);
    const m = svgEl('circle', { cx: 50, cy: 50, r: 20, fill: c[1] }, svg);
    const i = svgEl('circle', { cx: 50, cy: 50, r: 10, fill: c[2] }, svg);
    return f => {
      m.setAttribute('transform', tr(f * 4 * Math.cos(a), f * 4 * Math.sin(a)));
      i.setAttribute('transform', tr(f * 8 * Math.cos(a + 1.3), f * 8 * Math.sin(a + 1.3)));
    };
  },
  radial(svg, c) {
    const idx = r3(8); let tg;
    for (let j = 0; j < 8; j++) {
      const g = svgEl('g', { transform: rot(j * 45, 50, 50) }, svg);
      const inner = svgEl('g', {}, g);
      svgEl('rect', { x: 48, y: 18, width: 4, height: 20, fill: j % 2 ? c[2] : c[0] }, inner);
      if (j === idx) tg = inner;
    }
    svgEl('circle', { cx: 50, cy: 50, r: 6, fill: c[1] }, svg);
    return f => tg.setAttribute('transform', rot(f * 16, 50, 50));
  },
  checker(svg, c) {
    const idx = r3(9), a = dir(); let tg;
    for (let j = 0; j < 9; j++) {
      const r = Math.floor(j / 3), col = j % 3;
      const e = svgEl('rect', { x: 27 + col * 16, y: 27 + r * 16, width: 14, height: 14, fill: j === 4 ? c[2] : c[(r + col) % 2] }, svg);
      if (j === idx) tg = e;
    }
    return f => tg.setAttribute('transform', tr(f * 6 * Math.cos(a), f * 6 * Math.sin(a)));
  },
  nested(svg, c) {
    svgEl('rect', { x: 22, y: 22, width: 56, height: 56, fill: c[0] }, svg);
    const m = svgEl('rect', { x: 31, y: 31, width: 38, height: 38, fill: c[1] }, svg);
    const i = svgEl('rect', { x: 40, y: 40, width: 20, height: 20, fill: c[2] }, svg);
    return f => { m.setAttribute('transform', rot(f * 11, 50, 50)); i.setAttribute('transform', tr(-f * 4, f * 3)); };
  },
  row(svg, c) {
    svgEl('line', { x1: 16, y1: 64, x2: 84, y2: 64, stroke: c[0], 'stroke-width': .8, opacity: .5 }, svg);
    const ci = svgEl('circle', { cx: 28, cy: 50, r: 9, fill: c[0] }, svg);
    const sq = svgEl('rect', { x: 41, y: 41, width: 18, height: 18, fill: c[1] }, svg);
    const tri = svgEl('polygon', { points: '72,40.5 82,59 62,59', fill: c[2] }, svg);
    return f => {
      ci.setAttribute('transform', tr(0, -f * 7));
      sq.setAttribute('transform', rot(f * 12, 50, 50));
      tri.setAttribute('transform', tr(f * 3, f * 5));
    };
  },
  hexagon(svg, c) {
    const pts = [...Array(6)].map((_, j) => {
      const a = j * Math.PI / 3;
      return `${(50 + 28 * Math.cos(a)).toFixed(2)},${(50 + 28 * Math.sin(a)).toFixed(2)}`;
    }).join(' ');
    const h = svgEl('polygon', { points: pts, fill: c[0] }, svg);
    const d = svgEl('circle', { cx: 50, cy: 50, r: 9, fill: c[1] }, svg);
    return f => { h.setAttribute('transform', rot(f * 14, 50, 50)); d.setAttribute('transform', tr(f * 5, -f * 3)); };
  },

  /* ---- tier 4 ---- */
  quarters(svg, c) {
    const idx = r3(4); let tg, cx, cy;
    [
      ['M47.5 47.5 L21.5 47.5 A26 26 0 0 1 47.5 21.5 Z', 47.5, 47.5],
      ['M52.5 47.5 L52.5 21.5 A26 26 0 0 1 78.5 47.5 Z', 52.5, 47.5],
      ['M52.5 52.5 L78.5 52.5 A26 26 0 0 1 52.5 78.5 Z', 52.5, 52.5],
      ['M47.5 52.5 L47.5 78.5 A26 26 0 0 1 21.5 52.5 Z', 47.5, 52.5]
    ].forEach(([d, x, y], j) => {
      const p = svgEl('path', { d, fill: c[j % 3] }, svg);
      if (j === idx) { tg = p; cx = x; cy = y; }
    });
    return f => tg.setAttribute('transform', rot(f * 14, cx, cy));
  },
  target(svg, c) {
    const ring = svgEl('circle', { cx: 50, cy: 50, r: 27, fill: 'none', stroke: c[0], 'stroke-width': 4, pathLength: 360 }, svg);
    const x = svgEl('g', {}, svg);
    svgEl('rect', { x: 49, y: 16, width: 2, height: 68, fill: c[1] }, x);
    svgEl('rect', { x: 16, y: 49, width: 68, height: 2, fill: c[1] }, x);
    const dot = svgEl('circle', { cx: 50, cy: 50, r: 5, fill: c[2] }, svg);
    return f => {
      const g = Math.abs(f) * 30;
      if (g < .05) ring.removeAttribute('stroke-dasharray');
      else ring.setAttribute('stroke-dasharray', `${(360 - g).toFixed(3)} ${g.toFixed(3)}`);
      ring.setAttribute('transform', rot(-90 + f * 40, 50, 50));
      x.setAttribute('transform', tr(f * 5, -f * 3));
      dot.setAttribute('transform', tr(-f * 3, f * 4));
    };
  },
  grill(svg, c) {
    const idx = r3(5); let tg, cx;
    for (let j = 0; j < 5; j++) {
      const g = svgEl('g', {}, svg);
      svgEl('rect', { x: 28 + j * 10, y: 22, width: 4, height: 56, fill: c[j % 3] }, g);
      if (j === idx) { tg = g; cx = 30 + j * 10; }
    }
    return f => tg.setAttribute('transform', rot(f * 9, cx, 50));
  },
  orbit(svg, c) {
    svgEl('circle', { cx: 50, cy: 50, r: 26, fill: 'none', stroke: c[0], 'stroke-width': 2 }, svg);
    svgEl('circle', { cx: 50, cy: 76, r: 6, fill: c[2] }, svg);
    svgEl('circle', { cx: 50, cy: 50, r: 3, fill: c[0] }, svg);
    const g = svgEl('g', {}, svg);
    svgEl('circle', { cx: 50, cy: 24, r: 6, fill: c[1] }, g);
    return f => g.setAttribute('transform', rot(f * 22, 50, 50));
  }
};

/* ---------- Tile ---------- */
// the reference board's sixteen forms, dealt from a shuffled bag so each appears about equally
const SHAPES_USED = ['stripes', 'ring', 'square', 'triangle', 'cross', 'dots', 'diamond', 'chevrons',
                     'halfsplit', 'bars', 'concentric', 'radial', 'checker', 'nested', 'row', 'hexagon'];
const shapeBag = [];
function nextShape() {
  if (!shapeBag.length) shapeBag.push(...[...SHAPES_USED].sort(() => Math.random() - .5));
  return shapeBag.pop();
}
function makeTile(shape, colors, tier = 0) {
  shape = shape || nextShape();
  colors = colors || colorsFor(3, 3);   // colours unlock every stage
  useColor(colors[0]);
  const t = rand(.14, .86);
  let s;
  do { s = Math.random(); } while (Math.abs(s - t) < .18);

  const tile = { s, t, shape, colors, fixes: 0, mix: 1, perfect: false, w: [sign(), sign(), sign()] };

  const cell = document.createElement('div');
  cell.className = 'cell';
  const el = document.createElement('div');
  el.className = 'tile';
  el.tabIndex = 0;
  el.setAttribute('role', 'slider');
  el.setAttribute('aria-label', `${shape} tile`);
  el.setAttribute('aria-valuemin', '0');
  el.setAttribute('aria-valuemax', '100');
  cell.appendChild(el);

  const svg = svgEl('svg', { viewBox: '0 0 100 100', 'aria-hidden': 'true' });
  el.appendChild(svg);
  tile.update = BUILD[shape](svg, colors);
  svgEl('line', { x1: 14, y1: 91, x2: 86, y2: 91, class: 'trk' }, svg);
  tile.thumb = svgEl('rect', { x: 0, y: 89.4, width: 3.2, height: 3.2, class: 'thumb' }, svg);
  tile.ok = svgEl('rect', { x: 88, y: 8.5, width: 3.2, height: 3.2, class: 'ok', opacity: 0 }, svg);

  tile.cell = cell;
  tile.el = el;
  bind(tile);
  return tile;
}

/* ---------- Entanglement ----------
   d_i = s_i − t_i            (the tile's own distance from its secret target)
   e_i = d_i + k·Σ w·d_j      (what you actually see: its flaw, polluted by neighbours)
   A = I + kW is strictly diagonally dominant → unique solution s = t, and
   correcting tiles one at a time (Gauss–Seidel) converges. Solvable, slowly. */
function computeErrors() {
  const { k } = LV(), T = state.tiles, L = state.link;
  const d = T.map(t => t.s - t.t);
  return T.map((t, i) => d[i] + k * t.w[0] * d[L[i]]);
}

/* tile i is pushed by tile link[i]. One loop through all sixty, in random order,
   so the tile you are fixing usually disturbs one on the other side of the board. */
function makeLinks() {
  const n = state.tiles.length;
  const order = [...Array(n).keys()].sort(() => Math.random() - .5);
  state.link = new Array(n);
  order.forEach((i, j) => { state.link[i] = order[(j + 1) % n]; });
  state.tiles.forEach(t => { t.w = [sign(), sign(), sign()]; });
}

// error → visible flaw. sqrt makes the last few percent stubbornly visible.
function flaw(e, tol) {
  const a = Math.abs(e);
  if (a < tol) return 0;
  return Math.sign(e) * Math.min(1, Math.sqrt(a) * 1.25);
}

function render() {
  const e = computeErrors(), tol = LV().tol;
  let count = 0, fixed = null, broke = null;
  state.tiles.forEach((t, i) => {
    const p = Math.abs(e[i]) < tol;
    t.update(flaw(e[i], tol));
    t.thumb.setAttribute('x', (14 + 72 * t.s - 1.6).toFixed(2));
    t.el.setAttribute('aria-valuenow', Math.round(t.s * 100));
    if (p && !t.perfect) t.rightSince = performance.now();
    if (p && !t.perfect && !state.locked) fixed = t;          // (no snap, no chime: you're never told a shape is right)
    if (!p && t.perfect && !state.locked && !(state.drag && state.drag.tile === t)) broke = t;
    t.perfect = p;
    t.ok.setAttribute('opacity', 0);
    if (p) count++;
  });
  const tot = state.tiles.length;
  Sound.level(.55);                                           // the room sounds the same however far along you are
  return count === tot;
}

function snap(t) {
  t.el.classList.remove('snap');
  void t.el.offsetWidth;
  t.el.classList.add('snap');
}

/* ---------- Input ---------- */
function bind(tile) {
  const el = tile.el;
  el.addEventListener('pointerdown', ev => {
    if (state.locked || state.ritual) return;
    ev.preventDefault();
    el.focus({ preventScroll: true });
    el.setPointerCapture(ev.pointerId);
    const e0 = computeErrors(), i0 = state.tiles.indexOf(tile), dep = state.link.indexOf(i0);
    state.drag = { tile, x: ev.clientX, moved: false, id: ev.pointerId, e0: Math.abs(e0[i0]), dep, d0: dep >= 0 ? Math.abs(e0[dep]) : 0 };
    el.classList.add('active');
    begin();
    Voice.poke();
    if (tile.perfect) Voice.say('check', tile);
    else Voice.revisit(tile);
  });
  el.addEventListener('pointermove', ev => {
    const d = state.drag;
    if (!d || d.tile !== tile || state.locked || state.ritual || pinch) return;
    const dx = ev.clientX - d.x;
    d.x = ev.clientX;
    if (!dx) return;
    tile.s = clamp(tile.s + dx / DRAG_PX * (ev.shiftKey ? FINE : 1));
    d.moved = true;
    const me = state.tiles.indexOf(tile);
    state.tiles.forEach((t, j) => t.el.classList.toggle('echo', state.link[j] === me));
    Voice.poke();
    afterInput();
  });
  const end = () => {
    const d = state.drag;
    if (!d || d.tile !== tile) return;
    state.drag = null;
    el.classList.remove('active');
    document.querySelectorAll('.tile.echo').forEach(t => t.classList.remove('echo'));
    if (d.moved) {
      state.corrections++; tile.fixes++; counters();
      ARCH.touches.push([+((performance.now() - state.t0) / 1000).toFixed(1), state.tiles.indexOf(tile)]); Sound.tick(); maybeProgressRitual();
      state.sameCount = state.lastTouched === tile ? (state.sameCount || 1) + 1 : 1;
      state.lastTouched = tile;
      const i = state.tiles.indexOf(tile), e = Math.abs(computeErrors()[i]), tol = LV().tol;
      const e1 = computeErrors(), depMoved = d.dep >= 0 && Math.abs(e1[d.dep]) - d.d0 > tol * 4;
      if (state.sameCount >= 4) Voice.say('stuck', tile);
      else if (!tile.perfect && e < tol * 3.5) Voice.say('near', tile);
      else if (depMoved && Math.random() < .5) Voice.say('tug', state.tiles[d.dep]);
      else if (!tile.perfect && e > d.e0 + tol) Voice.say('worse', tile);
      else if (!tile.perfect) Voice.say(e < d.e0 ? 'better' : 'worse', tile);   // every touch gets an answer
    }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', ev => {
    if (state.locked || state.ritual) return;
    const step = ev.shiftKey ? .001 : .004;
    let delta = 0;
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') delta = step;
    if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') delta = -step;
    if (!delta) return;
    ev.preventDefault();
    begin();
    Voice.poke();
    tile.s = clamp(tile.s + delta);
    state.corrections++; tile.fixes++;
    counters();
    afterInput();
  });
}

function begin() {
  if (state.started) return;
  state.started = true;
  state.t0 = performance.now();
  document.querySelectorAll('.tile.beckon').forEach(t => t.classList.remove('beckon'));
  scheduleRitual();
}

function afterInput() {
  render();             // even when every shape is right, nothing happens. Only you can decide you're done.
}

/* ---------- The curse ---------- */
function solved() {
  state.locked = true;
  Voice.hush();
  Sound.silence(.08);
  resetView(true);
  if (state.drag) { state.drag.tile.el.classList.remove('active'); state.drag = null; }
  state.tiles.forEach(snap);
  document.body.classList.add('harmony');
  setTimeout(relapse, HARMONY_MS);
}

function expand() {
  const o = LV(), nl = levelDef(state.level + 1);
  const offC = Math.floor((nl.c - o.c) / 2), offR = Math.floor((nl.r - o.r) / 2);
  const before = grid.getBoundingClientRect();
  const T = new Array(nl.c * nl.r);
  state.tiles.forEach((t, i) => {
    const r = Math.floor(i / o.c), c = i % o.c;
    t.mix = 0;  // the old tiles stay perfect... for now
    T[(r + offR) * nl.c + (c + offC)] = t;
  });
  state.level++;
  state.fig++;
  for (let i = 0; i < T.length; i++) {
    if (!T[i]) { T[i] = makeTile(null, null, tier()); T[i].cell.classList.add('enter'); }
  }
  T.forEach(t => { t.w = [sign(), sign(), sign()]; });
  state.tiles = T;

  grid.style.transition = 'none';
  grid.style.transform = 'none';
  sizeFrame();
  grid.style.gridTemplateColumns = `repeat(${nl.c}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${nl.r}, 1fr)`;
  grid.replaceChildren(...T.map(t => t.cell));
  render();

  // place the grid so the solved block sits exactly where it was, then let go
  const g = grid.getBoundingClientRect();
  const cw = g.width / nl.c, ch = g.height / nl.r;
  const k = before.width / (o.c * cw);
  const tx = before.left - g.left - offC * cw * k;
  const ty = before.top - g.top - offR * ch * k;
  grid.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`;
  void grid.offsetWidth;

  requestAnimationFrame(() => {
    grid.style.transition = `transform ${ZOOM_MS}ms cubic-bezier(.65,0,.15,1)`;
    grid.style.transform = 'none';
    const half = Math.max(nl.c, nl.r) / 2;
    T.forEach((t, i) => {
      if (!t.cell.classList.contains('enter')) return;
      const r = Math.floor(i / nl.c), c = i % nl.c;
      const dist = Math.hypot(r - (nl.r - 1) / 2, c - (nl.c - 1) / 2) / half;
      t.el.style.transitionDelay = '600ms';   // all new tiles arrive together
      t.cell.classList.remove('enter');
    });
  });

  setTimeout(infect, ZOOM_MS + 150);
}

/* the moment passes. every target moves, the ties re-form, and it is all wrong again */
/* ======================================================
   "Right" doesn't hold.
   A tile that has been right for a while quietly slips — just past the line,
   barely visible. No sound, no thought, no notice. You only find out by checking.
   ====================================================== */
let lastDrift = 0;
setInterval(() => {
  if (!state.started || state.locked || state.ended) return;
  const now = performance.now();
  const gap = Math.max(2500, 7000 - intensity() * 600);          // it happens more often the longer you stay
  if (now - lastDrift < gap || Math.random() > .35) return;
  const { tol } = LV(), e = computeErrors();
  const ripe = state.tiles.filter((t, i) =>
    t.perfect && !(state.drag && state.drag.tile === t) &&
    now - (t.rightSince || now) > (t.holdFor || (t.holdFor = rand(6000, 45000))));
  if (!ripe.length) return;
  const t = pick(ripe), i = state.tiles.indexOf(t);
  const dir = Math.sign(e[i]) || sign();
  t.t -= dir * tol * rand(1.35, 1.8);                                // just past "right" — almost nothing
  t.holdFor = rand(6000, 45000);
  lastDrift = now;
  state.drifting = true;  // the slip makes no sound and draws no comment
  render();
  state.drifting = false;
}, 1000);

function relapse() {
  grid.style.transition = 'opacity 700ms ease';
  grid.style.opacity = 0;
  setTimeout(() => {
    for (const k in colorUse) delete colorUse[k];
    shapeBag.length = 0;
    const { c, r } = LV();
    state.tiles = Array.from({ length: c * r }, () => makeTile(null, null, 3));
    makeLinks();
    grid.replaceChildren(...state.tiles.map(t => t.cell));
    const tol = LV().tol * 5;   // never start with a tile that already looks right
    for (let guard = 0; guard < 2000; guard++) {
      const e = computeErrors(), bad = e.findIndex(v => Math.abs(v) < tol);
      if (bad < 0) break;
      const t = state.tiles[bad];
      do { t.s = Math.random(); } while (Math.abs(t.s - t.t) < .18);
    }
    state.fig++;
    render();                                   // still locked: no snaps while it appears
    document.body.classList.remove('harmony');
    grid.style.opacity = 1;
    setTimeout(() => { state.locked = false; render(); Voice.say('expand'); }, 750);
  }, 750);
}

/* the field keeps square cells; its outline follows c × r */
function sizeFrame() {
  const { c, r } = LV();
  // the same margin on every side — top, bottom, left, right. Tiles stay square; if the screen's
  // proportions don't match the board's, the gaps between them give a little instead.
  const W = innerWidth, H = innerHeight, M = Math.max(24, Math.round(Math.min(W, H) * .045)), g = .101;
  const B = M + Math.max(44, Math.round(M * 1.2));    // the bottom keeps extra room: that is where the two buttons sit
  const S = Math.min((W - 2 * M) / (c + (c - 1) * g), (H - M - B) / (r + (r - 1) * g));
  const gx = (W - 2 * M - c * S) / (c - 1), gy = (H - M - B - r * S) / (r - 1);
  const cw = S + gx, ch = S + gy;
  frame.style.width = `${cw * c}px`;
  frame.style.height = `${ch * r}px`;
  frame.style.left = `${M - gx / 2}px`;
  frame.style.top = `${M - gy / 2}px`;
  document.documentElement.style.setProperty('--M', `${M}px`);
  document.documentElement.style.setProperty('--B', `${B}px`);
  frame.style.setProperty('--ix', `${(gx / 2).toFixed(2)}px`);
  frame.style.setProperty('--iy', `${(gy / 2).toFixed(2)}px`);
  const cell = S / (1 - .092);
  frame.style.setProperty('--m', `${(cell * .36).toFixed(1)}px`);    // marks sit the same distance out on every side
  frame.style.setProperty('--ms', `${(cell * .18).toFixed(1)}px`);
}

function infect() {
  document.body.classList.remove('harmony');
  state.tiles.forEach(t => { t.el.style.transitionDelay = ''; });
  document.body.classList.toggle('dense', state.level >= 4);
  scheduleRitual();
  const olds = state.tiles.filter(t => t.mix < 1);
  const t0 = performance.now();
  (function step(now) {
    const p = Math.min(1, (now - t0) / BREAK_MS);
    const eased = p * p * (3 - 2 * p);
    olds.forEach(t => { t.mix = eased; });
    render();
    if (p < 1) requestAnimationFrame(step);
    else { state.locked = false; afterInput(); setTimeout(() => Voice.say('expand'), 700); }
  })(t0);
}

/* ---------- HUD ---------- */
function pad(n, w) { return String(n).padStart(w, '0'); }

function hud(count) {
  const tot = state.tiles.length, w = Math.max(2, String(tot).length);
  $('aligned').innerHTML = `${pad(count, w)}<span> / ${pad(tot, w)}</span>`;
  $('barFill').style.width = `${(count / tot) * 100}%`;
  $('bar').classList.toggle('full', count === tot);
  $('fig').textContent = `Fig. ${pad(state.fig, 2)}`;
  $('field').textContent = `Field ${LV().c} × ${LV().r}`;
  $('units').textContent = `${pad(tot, 2)} units`;
}

function counters() { $('corr').textContent = pad(state.corrections, 4); $('rit').textContent = pad(state.rituals, 2); }

function showHint(text) {
  return;   // exhibition: no captions — the inner voice is the only text
  const h = $('hint');
  h.textContent = text;
  h.style.opacity = 1;
  clearTimeout(showHint.t);
  showHint.t = setTimeout(() => { h.style.opacity = 0; }, 5200);
}

setInterval(() => {
  if (!state.started) return;
  const s = Math.floor((performance.now() - state.t0) / 1000);
  $('time').textContent = `${pad(Math.floor(s / 60), 2)}:${pad(s % 60, 2)}`;
}, 250);

/* ---------- Init: two tiles, behind an instruction card ---------- */
function init() {
  // everyone gets the same board — the same sixty shapes, in the same places, crooked the same way
  const realRandom = Math.random;
  { let a = 60; Math.random = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  state.tiles = Array.from({ length: LV().c * LV().r }, () => makeTile(null, null, 3));
  makeLinks();
  document.body.classList.add('dense');   // the zoom control is there from the start
  sizeFrame();
  grid.style.gridTemplateColumns = `repeat(${LV().c}, 1fr)`;
  grid.style.gridTemplateRows = `repeat(${LV().r}, 1fr)`;
  grid.replaceChildren(...state.tiles.map(t => t.cell));

  // never start with a tile that already looks right
  const tol = LV().tol * 5;
  for (let guard = 0; guard < 2000; guard++) {
    const e = computeErrors();
    const bad = e.findIndex(v => Math.abs(v) < tol);
    if (bad < 0) break;
    const t = state.tiles[bad];
    do { t.s = Math.random(); } while (Math.abs(t.s - t.t) < .18);
  }
  Math.random = realRandom;   // from here on, chance is chance again
  ARCH.initial = Archive.levels();   // how crooked the board is when anyone sits down
  state.locked = true;   // stays locked until the intro is dismissed
  render();
  askBackground();

  const intro = $('intro');
  const go = () => {
    if (intro.classList.contains('out')) return;
    intro.classList.add('out');
    setTimeout(() => { intro.remove(); }, 1900);
    state.locked = false;
    lastAny = performance.now();
    ARCH.shownAt = performance.now();   // the timer in the corner runs from here: the board is in front of you
    // no instructions: if nothing happens, one control quietly moves
    setTimeout(() => { if (!state.started && state.tiles[0]) state.tiles[0].el.classList.add('beckon'); }, 7000);
  };
  // two ways to leave: you decide you're done, or you give up. (Doing nothing for a minute is the third.)
  const leave = how => () => { if (state.ended || state.locked && !state.started) return; ARCH.end = how; if (!state.started) begin(); ending(); };
  $('btnDone').addEventListener('click', leave('done'));
  $('btnGiveUp').addEventListener('click', leave('gave_up'));
  // first the question; the opening line only after it is answered
  const ask = $('ask');
  // straight to the archive from the first screen, and back again
  // (on the published site the archive has to be fetched first: the question stays up until it is ready, so the board never shows in between)
  $('askArch').addEventListener('click', async () => {
    const b = $('askArch'); if (b.disabled) return;
    b.disabled = true; b.classList.add('busy');
    await Archive.show();
    document.body.classList.add('peek');
    setTimeout(() => { ask.classList.add('peek'); b.disabled = false; b.classList.remove('busy'); }, 1300);   // once the archive has faded in over it
  });
  $('archHome').addEventListener('click', () => { Archive.hide(); document.body.classList.remove('peek'); ask.classList.remove('peek'); });
  ask.querySelectorAll('.ask-b button').forEach(b => b.addEventListener('click', () => {
    state.ocd = b.dataset.a;
    ARCH.name = ($('askName').value || '').replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 40);
    ask.classList.add('out');
    setTimeout(() => ask.remove(), 1300);
    setTimeout(go, 3600);
    intro.addEventListener('pointerdown', () => setTimeout(go, 200));
  }));
}

/* the first screen: a few of the sixty, large and faint, drifting slowly around the question */
function askBackground() {
  const bg = $('askBg'); if (!bg) return;
  //        x     y     size  rot   dx    dy    turn  dur  opacity
  const spots = [
    [-7,  -10,  46,  -8,   3,   4,   5,  38, .13],
    [69,  -14,  40,   6,  -4,   3,   4,  44, .12],
    [86,   27,  30,  -4,  -3,  -4,   6,  33, .15],
    [74,   63,  48,  10,  -2,  -5,   4,  47, .12],
    [37,   80,  30,  -3,   4,  -3,   5,  36, .11],
    [ 3,   58,  42,   5,   4,  -3,   5,  41, .13],
    [-9,   27,  24,  12,   3,   3,   7,  29, .14],
    [22,    5,  17,  -6,   3,   4,   8,  26, .17],
    [58,   13,  13,   9,  -3,   3,   9,  24, .18],
    [25,   77,  14,  -9,   3,  -3,   8,  27, .16],
    [93,    4,  12,   4,  -2,   4,   9,  23, .17],
    [16,   41,   9,  14,   2,   3,  10,  21, .2 ],
    [83,   52,   9,  -12, -2,   3,  10,  22, .2 ],
  ];
  const e = computeErrors(), tol = LV().tol, seen = new Set(), pick = [];
  state.tiles.forEach(t => { if (!seen.has(t.shape)) { seen.add(t.shape); pick.push(t); } });
  spots.forEach((p, k) => {
    const t = pick[(k * 5) % pick.length];
    t.update(0);
    const svg = t.el.querySelector('svg').cloneNode(true);
    svg.querySelectorAll('.trk,.thumb,.ok').forEach(n => n.remove());
    svg.removeAttribute('id');
    const d = document.createElement('div');
    d.className = 'fl';
    const [x, y, sz, r0, dx, dy, rr, dur, o] = p;
    const D = dur * .55;   // more travel, a bit quicker: you notice them moving, but they never hurry
    d.style.cssText = `--x:${x}vw;--y:${y}vh;--sz:${sz}vmin;--r0:${r0}deg;--dx:${dx * 3.2}vmin;--dy:${dy * 3.2}vmin;--rr:${rr * 2.5}deg;--d:${D}s;--dl:${-(k * 7.3) % D}s;--o:${o}`;
    d.appendChild(svg);
    bg.appendChild(d);
  });
  state.tiles.forEach((t, i) => t.update(flaw(e[i], tol)));   // the board goes back to how it was
}

/* ======================================================
   Tools. A ruler, a spirit level, a magnifier, a grid.
   They really help — and every time you pick one up, that is one more check.
   The archive keeps how often each was reached for, and for how long.
   ====================================================== */
const Tools = (() => {
  const names = ['ruler', 'level', 'lens', 'grid'];
  const el = { ruler: $('tRuler'), level: $('tLevel'), lens: $('tLens'), grid: $('tGuide') };
  const pos = { ruler: null, level: null, lens: null };
  const open = {}, since = {};
  let ang = 0, bubX = 0, bubV = 0, lensTimer = 0, raf = 0;
  ARCH.tools = Object.fromEntries(names.map(n => [n, { n: 0, t: 0 }]));
  const usable = () => !state.locked && !state.ended && !state.ritual;
  const use = n => { ARCH.tools[n].n++; lastAny = performance.now(); };

  function place(n) {
    const p = pos[n]; if (!p) return;
    el[n].style.transform = `translate(${p.x}px, ${p.y}px)` + (n === 'ruler' ? ` rotate(${ang}deg)` : '');
    if (n === 'lens') lensMove();
  }
  function defaults(n) {
    const W = innerWidth, H = innerHeight;
    return { ruler: { x: W * .5, y: H * .42 }, level: { x: W * .36, y: H * .62 }, lens: { x: W * .64, y: H * .58 } }[n];
  }
  function toggle(n, force) {
    const on = force !== undefined ? force : !open[n];
    if (on === !!open[n]) return;
    if (on && !usable()) return;
    open[n] = on;
    document.querySelector(`.tray [data-tool="${n}"]`).classList.toggle('on', on);
    el[n].classList.toggle('on', on);
    if (on) {
      since[n] = performance.now(); use(n);
      if (n !== 'grid') { if (!pos[n]) pos[n] = defaults(n); place(n); }
      if (n === 'grid') gridSize();
      if (n === 'lens') { lensClone(); lensTimer = setInterval(lensClone, 450); }
    } else {
      ARCH.tools[n].t += (performance.now() - since[n]) / 1000;
      if (n === 'lens') clearInterval(lensTimer);
    }
    if (open.level && !raf) raf = requestAnimationFrame(levelTick);
  }
  function off() { names.forEach(n => toggle(n, false)); }
  function summary() {        // what goes to the archive: [times picked up or moved, seconds out]
    const out = {};
    names.forEach(n => { const t = ARCH.tools[n].t + (open[n] ? (performance.now() - since[n]) / 1000 : 0); out[n] = [ARCH.tools[n].n, Math.round(t)]; });
    return out;
  }

  document.querySelectorAll('.tray button').forEach(b => b.addEventListener('click', () => toggle(b.dataset.tool)));

  /* dragging any of the three */
  ['ruler', 'level', 'lens'].forEach(n => {
    const t = el[n];
    t.addEventListener('pointerdown', ev => {
      if (!usable() || ev.target.closest('.rot')) return;
      ev.preventDefault(); ev.stopPropagation();
      t.setPointerCapture(ev.pointerId); t.classList.add('dragging'); use(n);
      const ox = ev.clientX - pos[n].x, oy = ev.clientY - pos[n].y;
      const move = e => { pos[n] = { x: e.clientX - ox, y: e.clientY - oy }; place(n); };
      const up = () => { t.classList.remove('dragging'); t.removeEventListener('pointermove', move); t.removeEventListener('pointerup', up); t.removeEventListener('pointercancel', up); };
      t.addEventListener('pointermove', move); t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up);
    });
    t.addEventListener('wheel', ev => {
      ev.preventDefault(); ev.stopPropagation();
      if (n !== 'ruler' || !usable()) return;
      ang += Math.sign(ev.deltaY) * (ev.shiftKey ? .1 : .5); setAng(ang);
    }, { passive: false });
  });

  /* the ruler turns: scroll on it, or drag the round handle. Double-click puts it back to level. */
  function setAng(a) { ang = ((a + 90) % 180 + 180) % 180 - 90; $('tDeg').textContent = `${ang.toFixed(1)}°`; place('ruler'); }
  $('tRot').addEventListener('pointerdown', ev => {
    if (!usable()) return;
    ev.preventDefault(); ev.stopPropagation(); use('ruler');
    const h = $('tRot'); h.setPointerCapture(ev.pointerId);
    const a0 = Math.atan2(ev.clientY - pos.ruler.y, ev.clientX - pos.ruler.x) * 180 / Math.PI, g0 = ang;
    const move = e => setAng(g0 + Math.atan2(e.clientY - pos.ruler.y, e.clientX - pos.ruler.x) * 180 / Math.PI - a0);
    const up = () => { h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up);
  });
  el.ruler.addEventListener('dblclick', () => { if (usable()) { use('ruler'); setAng(0); } });

  /* the level reads the shape under it — honestly, with a bubble that never quite stops */
  function tileUnder(x, y) {
    for (const e of document.elementsFromPoint(x, y)) { const t = e.closest && e.closest('.tile'); if (t) return state.tiles.findIndex(k => k.el === t); }
    return -1;
  }
  function levelTick(now) {
    raf = 0;
    if (!open.level) return;
    const i = pos.level ? tileUnder(pos.level.x, pos.level.y) : -1;
    let target = 0;
    if (i >= 0) { const e = computeErrors(); target = flaw(e[i], LV().tol); }
    else target = Math.sin(now / 900) * .15;
    const tube = 136 - 16;   // how far the bubble can go each way, in px, is half of this
    const goal = target * tube / 2 + Math.sin(now / 370) * .45 + Math.sin(now / 1130) * .35;   // a little sway, always
    bubV = bubV * .82 + (goal - bubX) * .06; bubX += bubV;
    $('tBub').style.transform = `translateX(${bubX.toFixed(2)}px)`;
    raf = requestAnimationFrame(levelTick);
  }

  /* the magnifier: a copy of the board, enlarged under the glass */
  const K = 2.6;
  function lensClone() {
    const inner = $('tLensIn'), f = document.querySelector('.stage .frame');
    const c = f.cloneNode(true); c.removeAttribute('id');
    c.querySelectorAll('[id]').forEach(x => x.removeAttribute('id'));
    c.querySelectorAll('.guide').forEach(g => g.classList.toggle('on', !!open.grid));
    const r = f.getBoundingClientRect();
    c.style.left = r.left + 'px'; c.style.top = r.top + 'px';
    const v = c.querySelector('.view > div'); if (v) { v.style.position = 'absolute'; v.style.inset = '0'; v.style.display = 'grid'; }
    inner.replaceChildren(c);
    lensMove();
  }
  function lensMove() {
    const p = pos.lens; if (!p) return;
    const R = 105, inner = $('tLensIn');
    inner.style.transformOrigin = `${p.x}px ${p.y}px`;
    inner.style.transform = `translate(${R - p.x}px, ${R - p.y}px) scale(${K})`;
  }

  /* the grid: a line through the middle of every shape, and finer ones either side */
  function gridSize() {
    const { c, r } = LV(), g = $('tGuide');
    g.style.setProperty('--gw', `${100 / c}%`); g.style.setProperty('--gh', `${100 / r}%`);
  }
  addEventListener('resize', () => { if (open.grid) gridSize(); if (open.lens) lensClone(); });

  return { toggle, off, summary, open: () => ({ ...open }) };
})();

/* the clock: how long you have been in front of the board (it stops when you do) */
const mmss = sec => { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, x = sec % 60, p = n => String(n).padStart(2, '0'); return h ? `${h}:${p(m)}:${p(x)}` : `${p(m)}:${p(x)}`; };
const onBoard = () => ARCH.shownAt ? ((ARCH.endedAt || performance.now()) - ARCH.shownAt) / 1000 : 0;
function clock() { $('clock').textContent = mmss(onBoard()); }
clock();
setInterval(clock, 250);

/* ======================================================
   The end — it ends only when you stop.
   A minute without touching anything, and the room lets you go.
   Then it resets for whoever comes next.
   ====================================================== */
let lastAny = performance.now();
const IDLE_END_MS = 60000;
['pointerdown', 'pointermove', 'keydown', 'wheel'].forEach(t =>
  window.addEventListener(t, () => { lastAny = performance.now(); }, { capture: true, passive: true }));

function ending() {
  if (state.ended) return;
  state.ended = true;
  state.locked = true;
  ARCH.endedAt = performance.now();
  clock();
  Tools.off(); document.body.classList.add('ended');
  if (!ARCH.end) ARCH.end = 'idle';
  $('endbar').classList.remove('on');
  clearTimeout(ritualTimer);
  if (state.ritual) {
    const r = state.ritual;
    clearInterval(r.iv); clearTimeout(r.subT); cancelAnimationFrame(r.raf); clearInterval(r.iv);
    state.ritual = null; R.el.hidden = true; clearStage();
  }
  Voice.hush();
  Sound.silence(2.5);
  document.querySelectorAll('.note').forEach(n => n.remove());
  Archive.arrive();                    // no words: your board shrinks, and goes in among everyone else's
}
setInterval(() => {
  if (state.started && !state.ended && performance.now() - lastAny > IDLE_END_MS) ending();
}, 1000);

/* ======================================================
   The archive — everyone who sat in front of these same seventy shapes.
   Real visitors are kept in this browser; around them, six hundred demo
   visitors (simulated, marked "demo"), so it is never empty.
   ====================================================== */
setInterval(() => {      // the session, as it happens: every change to every shape, so it can be watched again
  if (!state.started || state.ended || typeof Archive === 'undefined') return;
  const lv = Archive.levels(), t = +((performance.now() - state.t0) / 1000).toFixed(1);
  if (!ARCH.start) { ARCH.start = lv; ARCH.prev = lv.slice(); return; }
  lv.forEach((l, i) => { if (l !== ARCH.prev[i]) { ARCH.events.push([t, i, l]); ARCH.prev[i] = l; } });
}, 350);
setInterval(() => {      // how much of it was right, every five seconds
  if (!state.started || state.ended) return;
  ARCH.timeline.push(+(state.tiles.filter(t => t.perfect).length / state.tiles.length).toFixed(3));
}, 5000);

/* the shared archive for the published site: a Google Sheet behind a small Apps Script web app */
const Remote = (() => {
  const cols = ['id', 'at', 'name', 'ocd', 'dur', 'corr', 'left', 'chk', 'lv', 'fixes', 'tl'];
  async function list() {
    if (!SHEET_URL) return [];
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 6000);
      const res = await fetch(SHEET_URL + '?list=1', { signal: ctl.signal }); clearTimeout(to);
      const rows = await res.json();
      return rows.map(r => ({ remote: true, id: r.id, at: +r.at, name: r.name || '', ocd: r.ocd || 'skip', dur: +r.dur, corr: +r.corr, left: +r.left, chk: +r.chk,
        lv: JSON.parse(r.lv), fixes: JSON.parse(r.fixes), tl: JSON.parse(r.tl || '[]') })).filter(r => Array.isArray(r.lv) && r.lv.length === state.tiles.length);
    } catch (e) { return []; }
  }
  async function detail(id) {
    try { const res = await fetch(SHEET_URL + '?id=' + encodeURIComponent(id)); const d = await res.json(); return d && d.ev ? d : null; } catch (e) { return null; }
  }
  function send(rec) {
    const row = { at: rec.at, name: rec.name, ocd: rec.ocd, dur: rec.dur, corr: rec.corr, left: rec.left, chk: rec.chk,
      lv: JSON.stringify(rec.lv), fixes: JSON.stringify(rec.fixes), tl: JSON.stringify(rec.tl.map(v => +v.toFixed(2))),
      detail: JSON.stringify({ start: rec.start, ev: rec.ev, th: rec.th, end: rec.end, total: rec.total, wait: rec.wait, tools: rec.tools }) };
    // text/plain keeps the browser from asking permission first; the script reads it as JSON
    fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(row) }).catch(() => {});
  }
  return { list, detail, send, cols };
})();

const Archive = (() => {
  const KEY = 'just-right-60:archive2';
  const COLS = LEVELS[0].c, ROWS = LEVELS[0].r, N = COLS * ROWS;
  const TS = 10, PAD = 3, GAP = 4;                          // world units: a tile is 10
  const BW = COLS * TS + PAD * 2, BH = ROWS * TS + PAD * 2, CW = BW + GAP, CH = BH + GAP;

const R = { el: $('ritual'), box: $('rBox'), text: $('rText'), sub: $('rSub'), pips: $('rPips'), no: $('rNo') };

  tr: ['calc(100% - var(--z) / 2)', 'calc(var(--z) / 2)'],
  br: ['calc(100% - var(--z) / 2)', 'calc(100% - var(--z) / 2)'],
  bl: ['calc(var(--z) / 2)', 'calc(100% - var(--z) / 2)'],
  c: ['50%', '50%'],
  left: ['calc(var(--z) / 2)', '50%'],
  right: ['calc(100% - var(--z) / 2)', '50%']

function scheduleRitual() {
  return;   // pop-up tasks removed
  clearTimeout(ritualTimer);

  const [a, b] = [[24, 36], [16, 26], [11, 19], [7, 13]][tier()];
  ritualTimer = setTimeout(() => {

    startRitual();

function makeRitual(forced) {
  const type = forced || pick(['tap', 'clockwise', 'still', 'rhythm', 'mirror',
    'trace', 'trace', 'clean', 'clean', 'dwell', 'dwell', 'putback', 'putback',
    'lineup', 'lineup', 'hold', 'straighten', 'straighten']);
  if (INTERACTIVE[type]) return INTERACTIVE[type]();
  if (type === 'tap') {
    const where = pick(['tl', 'tr', 'br', 'bl', 'c']), need = pick([4, 4, 8]);
    return { type, seq: Array(need).fill(where),
      text: `Touch the ${NAME[where]}${where === 'c' ? '' : ' corner'}.`,
      sub: `${need === 4 ? 'Four' : 'Eight'} times. Nothing else.` };
